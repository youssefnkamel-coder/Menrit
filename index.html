/* Layout: a modern mobile app. A teal-to-blue gradient card opens the page, white rounded cards hold each screen,
   every section and tab carries its own coloured icon tile, and the nav is a bottom app bar on phones. */
:root{
  --a:#0f766e; --a2:#0e7490; --b:#1e40af; --h1:#14706a; --h2:#0d3b5c; --h3:#0a1f3d;
  --bg:#f6efe1; --surface:#fffdf8; --surface-2:#fbf5e9; --line:#ebe1cc;
  --ink:#172033; --ink-2:#5b6680; --on-a:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#e11d48;
  /* text-safe shades of ok/warn/gold (4.5:1 on light surfaces) */
  --ok-ink:#166534; --warn-ink:#92400e; --gold-ink:#8a6414;
  --shadow:0 1px 2px rgba(23,32,51,.05), 0 6px 20px rgba(23,32,51,.06);
  --f-head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-scripture:"Amiri","Noto Naskh Arabic",serif;
  --nav-h:68px; --r:20px;
  --brand-grad:linear-gradient(135deg,var(--a),var(--b));
  --gold:#c9a227; --gold-2:#e9c96b; --gold-d:#8a6414;
  --gold-grad:linear-gradient(180deg,#f2d06b,#d4a630 30%,#a8741a 55%,#d4a630 80%,#f2d06b);
  --gold-line:color-mix(in oklab,var(--gold) 45%,transparent);
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --ok-ink:#4ade80; --warn-ink:#fbbf24; --gold-ink:#e9c96b; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --ok-ink:#4ade80; --warn-ink:#fbbf24; --gold-ink:#e9c96b; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.22rem} h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.85}
/* iPhone Safari draws date / time boxes at their own width and ignores width:100%, so they stuck out of the card */
input,select,textarea{max-width:100%;box-sizing:border-box}
input[type=date],input[type=datetime-local],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:1.4}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:right;margin:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in oklab,var(--gold) 20%,transparent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:5px;font-size:.86rem;color:var(--ink-2);font-weight:600}
a{color:var(--a);font-weight:600}
.btn{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on-a);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700;white-space:nowrap;
  box-shadow:0 4px 14px color-mix(in oklab,var(--a) 30%,transparent)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:color-mix(in oklab,var(--a) 12%,var(--surface));color:var(--a);box-shadow:none}
.btn.quiet{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.btn.quiet.danger-text{color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
.btn[aria-busy="true"]{opacity:.8;cursor:progress}
.btn[aria-busy="true"]::before{content:"";display:inline-block;width:.95em;height:.95em;margin-inline-end:8px;vertical-align:-.12em;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:btn-spin .7s linear infinite}
@keyframes btn-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.btn[aria-busy="true"]::before{animation-duration:1.8s}}

/* colourful icon tiles */
.ico{--c:#64708a;display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:11px;
  background:color-mix(in oklab,var(--c) 15%,var(--surface));color:var(--c)}
.ico svg{width:20px;height:20px}
.ico.lg{width:44px;height:44px;border-radius:14px}.ico.lg svg{width:24px;height:24px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 30px color-mix(in oklab,var(--a) 30%,transparent);display:grid;gap:10px}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;inset-inline-end:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.cross{width:40px;height:40px;padding:7px;border-radius:12px;background:rgba(255,255,255,.2);color:#fff}
.brand{display:grid}
.brand .eyebrow{font-size:.8rem;opacity:.9;font-weight:600}
.brand h1{font-size:1.6rem;color:#fff}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.glass{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;color:#fff;display:inline-flex;gap:6px;align-items:center}
.coptic{font-family:var(--f-head);font-weight:800;font-size:1rem}
#gregDate{opacity:.95}
.season-chip i{width:8px;height:8px;border-radius:50%;background:#fff}
#feastLine{position:relative;z-index:1;font-weight:700}
#feastLine:empty{display:none}
#noticeSlot:empty{display:none}
.notice{color:var(--ink);margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.notice .btn{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.notice .btn.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px;background:var(--bg)}
nav.tabs .wrap{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
nav.tabs button{position:relative;border:0;background:var(--surface);box-shadow:var(--shadow);padding:5px 14px 5px 6px;border-radius:14px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;font-weight:700;font-family:var(--f-head)}
nav.tabs button .ico{width:30px;height:30px;border-radius:10px}
nav.tabs button .ico svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ico{background:var(--c);color:#fff}
nav.tabs .badge{min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;font-weight:700}
@media (max-width:720px), (orientation:landscape) and (max-height:520px){
  nav.tabs{position:fixed;inset:auto 0 0 0;top:auto;background:var(--surface);padding:6px max(6px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px));
    box-shadow:0 -4px 20px rgba(23,32,51,.08);border-top:1px solid var(--line)}
  #app{padding-top:14px}
  nav.tabs .wrap{flex-wrap:nowrap;justify-content:space-around;gap:0}
  nav.tabs button{flex:1;flex-direction:column;gap:2px;padding:2px;font-size:.7rem;box-shadow:none;background:transparent}
  nav.tabs .badge{position:absolute;top:-2px;inset-inline-start:calc(50% + 8px)}
}

main{display:grid;gap:18px}
section{display:grid;gap:10px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.sec-head h2{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.form > *{min-width:0}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:start;color:var(--ink);justify-items:start}
.stat b{font-family:var(--f-head);font-size:1.8rem;font-weight:800;line-height:1}
.stat span:last-child{font-size:.8rem;color:var(--ink-2);font-weight:600}
.stat.alert b{color:var(--bad)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}}

ul.list{list-style:none;margin:0;padding:4px 0;display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
ul.list li{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
ul.list li:first-child{border-top:0}
ul.list li.click{cursor:pointer}
ul.list li.click:hover{background:var(--surface-2)}
.who{display:grid;min-width:0}
.who strong{font-weight:700}
.pill{display:inline-block;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:600;line-height:24px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:color-mix(in oklab,var(--warn) 15%,var(--surface));color:var(--warn-ink)}
.pill.bad{background:color-mix(in oklab,var(--bad) 15%,var(--surface));color:var(--bad)}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,var(--surface));color:var(--ok-ink)}
.nid-pill{white-space:normal;line-height:1.45;padding-block:3px}
.nid-row{gap:6px}
.acc-row > .nid-row{grid-column:1/-1}
.nid-box{display:grid;gap:6px}
.nid-mask{direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px}
.nid-hint{margin:0;color:var(--ink-2)}
.nid-hint.ok{color:var(--ok-ink)}
.nid-hint.bad{color:var(--bad);font-weight:600}
.pill.acc{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center;font-weight:600}
.family-head{font-family:var(--f-head);font-weight:800;font-size:.95rem;color:var(--a)}

.reading{display:grid;gap:6px}
.reading .ref{display:inline-block;width:max-content;font-size:.76rem;font-weight:700;color:#0d9488;background:color-mix(in oklab,#14b8a6 14%,var(--surface));padding:0 10px;border-radius:999px}
.auto-read{display:grid;gap:10px}
.rsec{border:1px solid var(--gold-line);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.rsec>summary{cursor:pointer;list-style:none;font-weight:700}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary::before{content:"▸ ";color:#0d9488}
.rsec[open]>summary::before{content:"▾ "}
.rsub{margin:6px 0 0;font-size:.95rem;color:var(--a)}
.syn{font-family:var(--f-body)!important;font-size:1.02rem!important}
.reading .text{font-family:var(--f-scripture);font-size:1.18rem;line-height:2;white-space:pre-wrap;max-width:65ch}
.medit{display:grid;gap:6px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,color-mix(in oklab,#8b5cf6 10%,var(--surface)),color-mix(in oklab,#ec4899 8%,var(--surface)))}
.medit h3{color:#8b5cf6}
.medit .text{font-family:var(--f-scripture);font-size:1.22rem;line-height:2;white-space:pre-wrap;max-width:60ch}

.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:#22c55e;flex:none}
.check:has(input:checked){border-color:var(--gold);background:color-mix(in oklab,#22c55e 10%,var(--surface))}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.68rem;color:var(--ink-2);font-weight:600}
.day.l1{background:color-mix(in oklab,#22c55e 30%,var(--surface))}
.day.l2{background:color-mix(in oklab,#22c55e 62%,var(--surface));color:var(--ink)}
.day.l3{background:#15803d;color:#fff}
.detail{outline:0;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:20}
.sched-days{display:grid;gap:8px}
.sched-day{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sched-day.on{border-color:var(--gold)}
.sched-day .check{min-width:96px;font-weight:700}
.sched-hours{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sched-hours input{max-width:120px}
.sched-card h4{margin:6px 0 0;font-size:.92rem}
.time-row{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.time-row .chip-btn{border-radius:12px;padding:10px 4px;font-weight:700}
.time-row .chip-btn[aria-pressed="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
.digit-pick{border-radius:12px;padding:8px 14px;font-weight:700}
.digit-pick[aria-pressed="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
.toast.idle-warn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(92vw,460px);text-align:center;line-height:1.5}
footer{margin-top:24px;font-size:.8rem;color:var(--ink-2);text-align:center}
@media (max-width:480px){.days{gap:2px}}

/* verse ticker + welcome (from the service program) */
.ticker{margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:center;min-height:46px;display:grid;place-items:center}
#verse{font-family:var(--f-scripture);font-size:1.08rem;font-weight:700;line-height:1.7;transition:opacity .45s}
.welcome{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;position:relative;z-index:1;font-weight:700}
#liveClock{font-size:.84rem;opacity:.95;font-variant-numeric:tabular-nums}
.hero-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
body.locked .ticker{display:none}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.filters .chip-btn{padding:6px 12px;font-size:.88rem}
.chips.filters .chip-btn b{background:var(--line);border-radius:999px;padding:0 7px;margin-inline-start:2px}
.chips.filters .chip-btn[aria-pressed="true"] b{background:color-mix(in oklab,var(--a) 22%,var(--surface))}
ul.list li > .person-line{flex:1 1 240px}
.contact{display:inline-flex;gap:6px;margin-inline-start:auto}
.ic-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:1.05rem;border:1.5px solid var(--line);background:var(--surface)}
.ic-btn.call{border-color:#93c5fd;background:color-mix(in oklab,#3b82f6 14%,var(--surface))}
.ic-btn.wa{border-color:#86efac;background:color-mix(in oklab,#22c55e 14%,var(--surface))}
.family-head.letter-head{font-size:1.15rem}
.wa-after{border:2px solid #86efac;display:grid;gap:10px}
a.btn{text-decoration:none}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--a);background:color-mix(in oklab,var(--a) 10%,var(--surface))}
.kid-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center}
@media (max-width:480px){.kid-row{grid-template-columns:1fr 1fr auto}}
.warnbox{background:color-mix(in oklab,var(--warn) 12%,var(--surface));color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dev-id{display:inline-flex;align-items:center;gap:8px}
.dev-id img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.gate-church{width:96px;height:96px;max-width:100%;border-radius:50%;object-fit:cover;margin:0 auto;box-shadow:var(--shadow);background:#fff}
.gate-cross{width:80px;height:80px;margin:0 auto;border-radius:28px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.gate-cross svg{width:46px;height:46px}
.gate-priest{font-family:var(--f-head);font-weight:700;color:var(--a);font-size:1rem}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:1.1rem;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px color-mix(in oklab,var(--a) 45%,transparent)}

.person-line{display:flex;align-items:center;gap:12px;min-width:0}

/* login gate */
body.locked .band, body.locked nav.tabs, body.locked main, body.locked footer{display:none}
#gate{min-height:calc(100vh - 32px);min-height:calc(100svh - 32px);display:grid;place-items:center;align-items:safe center;padding-block:12px}
.gate-head, .gate-body{display:contents}
.gate-card{width:100%;max-width:min(400px,calc(100% - 12px));background:var(--surface);border-radius:26px;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(180deg,#f2d06b,#d4a630 30%,#a8741a 55%,#d4a630 80%,#f2d06b) border-box;box-shadow:0 0 0 1px rgba(138,90,18,.25),0 0 0 6px color-mix(in oklab,#d4a630 18%,transparent),var(--shadow);padding:26px 22px 20px;display:grid;gap:16px;text-align:center}
.gate-logo{width:96px;height:96px;max-width:100%;border-radius:50%;object-fit:cover;margin:0 auto;box-shadow:0 8px 24px rgba(110,24,52,.18)}
.gate-card h1{font-size:1.5rem}
.gate-mark{display:grid;gap:10px;justify-items:center}
.pending-wait{display:flex;gap:14px;align-items:center;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}

.pending-card{display:grid;gap:10px;border:2px solid transparent;background:linear-gradient(color-mix(in oklab,#06b6d4 7%,var(--surface)),color-mix(in oklab,#06b6d4 7%,var(--surface))) padding-box,var(--gold-grad) border-box}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--gold-line);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:12px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-head);font-weight:800;font-size:1rem;color:var(--ink-2);cursor:pointer;transition:background .15s}

.cal{display:grid;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.cal-nav{border:1.5px solid var(--gold-line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:1.3rem;font-weight:800;cursor:pointer;color:var(--a)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:.7rem;font-weight:700;color:var(--ink-2);text-align:center;padding-bottom:2px}
.cal-day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;display:grid;place-items:center;align-content:center;gap:0;padding:3px 0;cursor:pointer;color:var(--ink);line-height:1.15}
.cal-day b{font-size:.98rem;font-family:var(--f-head)}
.cal-day small{font-size:.62rem;color:var(--gold-d);font-weight:700}
.cal-day.wk{background:color-mix(in oklab,#f43f5e 6%,var(--surface))}
.cal-day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal-day.on{background:var(--brand-grad);color:#fff;border-color:transparent}
.cal-day.on small{color:#fde68a}
.cal-day:disabled{opacity:.3;cursor:default}
.pick-day{font-weight:700;color:var(--a);margin:0}
.slot-row{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-row .chip-btn{border-radius:14px;padding:10px 4px;min-height:64px;display:grid;place-items:center;align-content:center;gap:4px;font-family:var(--f-head);font-weight:700;font-size:.86rem;line-height:1.2;color:var(--ink)}
.slot-row .chip-btn .se{font-size:1.35rem;line-height:1}
.slot-row .chip-btn[aria-pressed="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
/* visit requests: same layout, warm amber colour so it is clearly the visit form */
.seg button.k-visit[aria-selected="true"]{background:linear-gradient(135deg,#d97706,#be123c);box-shadow:0 4px 12px rgba(217,119,6,.35)}
.req-form.visit{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#f59e0b,#e11d48,#f59e0b) border-box;border:2px solid transparent}
.req-form.visit h3{color:#d97706}
.req-form.visit .cal-day.on, .req-form.visit .slot-row .chip-btn[aria-pressed="true"]{background:linear-gradient(135deg,#d97706,#be123c);border-color:#fbbf24}
.req-form.visit .cal-day.today{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b inset}
.req-form.visit .pick-day{color:#d97706}
.req-form.visit .btn{background:linear-gradient(135deg,#d97706,#be123c)}
.req-form.visit .cal-nav{color:#d97706}
.visit-banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:color-mix(in oklab,#f59e0b 14%,var(--surface));border:1px dashed #f59e0b;font-weight:700;font-size:.9rem}
.visit-banner span:first-child{font-size:1.6rem}
.req-note{border-inline-start:4px solid var(--gold);background:color-mix(in oklab,var(--gold) 9%,var(--surface));border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.req-note span{font-size:.78rem;font-weight:700;color:var(--gold-d)}
@media (max-width:380px){.cal-day{min-height:40px}.cal-day b{font-size:.88rem}.cal-grid{gap:3px}}
.gate-photo{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;overflow:hidden;border:3px solid var(--gold);background:color-mix(in oklab,var(--gold) 10%,var(--surface));font-size:2.6rem;box-shadow:0 6px 18px rgba(15,118,110,.18)}
.gate-photo img{width:100%;height:100%;object-fit:cover}
.bio-art{font-size:3rem;text-align:center;line-height:1}
.bio-btn{background:linear-gradient(135deg,#7c3aed,#1e40af)!important}
.invite-card{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box;border:2px solid transparent}
.signup-box{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--gold-line)}
.signup-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.35rem;font-weight:800;letter-spacing:.18em;color:var(--brand,#0e7490)}
.invite-url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;background:var(--surface-2);border:1px dashed var(--gold-line);border-radius:12px;padding:10px 12px;word-break:break-all;user-select:all;text-align:left}
.invite-btns{flex-wrap:wrap;gap:8px}
.btn.wa{background:linear-gradient(135deg,#16a34a,#15803d);text-decoration:none}
.qr-box{display:grid;justify-items:center;gap:8px;padding:12px;border-radius:14px;background:#fff}
.qr-box[hidden]{display:none}
.qr-box .small{color:#334155!important;text-align:center}
.qr-img img, .qr-img canvas{display:block;border-radius:6px}
.kids-box{gap:10px}
.kids-title{font-weight:800;font-family:var(--f-head)}
.kid-card{border:1.5px solid var(--gold-line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;background:color-mix(in oklab,var(--gold) 5%,var(--surface))}
.kid-head{display:flex;justify-content:space-between;align-items:center}
.father-card{display:flex!important;align-items:center;gap:12px;flex-direction:row!important}
.father-card .avatar{width:52px;height:52px}
.father-pick{display:grid;gap:8px}
.father-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-family:var(--f-head);font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;text-align:start}
.father-opt[aria-checked="true"]{border-color:var(--gold);background:var(--brand-grad);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.3)}
.father-ic{font-size:1.3rem}
.fam-card{gap:10px}
.fam-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fam-person{display:flex;align-items:center;gap:10px}
.fam-kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding-top:8px;border-top:1px dashed var(--gold-line)}
.fam-kid{display:grid;gap:2px;border-radius:12px;padding:8px 10px;background:color-mix(in oklab,#f97316 8%,var(--surface))}
.fam-inline{display:grid;gap:8px}
.pending-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pending-row.open{display:grid;justify-content:stretch}
.pend-toggle{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;flex:1 1 240px;min-width:0;border-radius:12px}
.pend-toggle:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.pend-more{color:var(--a);font-weight:700;white-space:nowrap;margin-inline-start:auto}
.pend-detail{display:grid;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid color-mix(in oklab,var(--gold,#c9a227) 45%,transparent)}
.pend-photo{all:unset;cursor:zoom-in;flex:none;width:132px;height:132px;border-radius:16px;overflow:hidden;border:3px solid var(--gold,#c9a227);display:grid;place-items:center;background:var(--surface)}
.pend-photo img{width:100%;height:100%;object-fit:cover}
.pend-photo.none{cursor:default;color:var(--muted);font-size:.85rem}
.pend-facts{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;flex:1;min-width:200px}
.pend-facts dt{font-weight:700;color:var(--muted);font-size:.9rem}
.pend-facts dd{margin:0}
.news-wrap{position:fixed;inset:0;z-index:998;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:14px;overflow:auto}
.news-box{width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;background:var(--surface);border-radius:20px;border:2px solid var(--gold,#c9a227);padding:18px 18px 14px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.news-box h2{margin:0;font-size:1.25rem}.news-box h4{margin:6px 0 0;color:var(--gold-ink,#8a6414)}
.news-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news-list li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.news-list li .ne{font-size:1.4rem;line-height:1}.news-list li b{display:block}.news-list li span{font-size:.92rem;color:var(--ink-2,#5b6680)}
.news-adm{display:grid;gap:8px;padding:10px 12px;border:1px dashed var(--gold,#c9a227);border-radius:14px}
.photo-zoom{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.82);display:grid;place-items:center;align-content:center;gap:12px;padding:16px;cursor:zoom-out}
.photo-zoom img{max-width:min(92vw,560px);max-height:78vh;border-radius:18px;border:3px solid var(--gold,#c9a227)}
.menrit{display:grid;justify-items:center;gap:2px;line-height:1}
.menrit .mn-word{font-family:"Noto Sans Coptic","Segoe UI Historic","Segoe UI Symbol",serif;font-size:2.7rem;letter-spacing:.06em;padding:4px 6px 6px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7)) drop-shadow(0 3px 6px rgba(138,90,18,.28))}
.menrit .mn-sub{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:.78rem;color:var(--gold-d);letter-spacing:.04em}
.menrit .mn-sub::before,.menrit .mn-sub::after{content:"";width:46px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
.menrit .mn-sub::after{transform:scaleX(-1)}
.mn-pill{display:block;width:fit-content;font-family:"Noto Sans Coptic","Segoe UI Historic","Segoe UI Symbol",serif;font-size:1.05rem;letter-spacing:.06em;padding:1px 12px 3px;border-radius:999px;border:1.5px solid transparent;background:linear-gradient(#0d4f63,#123f7a) padding-box,var(--gold-grad) border-box;color:#f6dc8a;text-shadow:0 1px 4px rgba(0,0,0,.35);margin-bottom:4px}
.gate-card .form{text-align:start}
.pw{position:relative}
.pw input{padding-inline-end:48px}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--a);font-weight:700;font-size:.82rem;cursor:pointer;padding:4px 8px}
.gate-err{color:var(--bad);font-weight:600;font-size:.88rem;min-height:1.2em}
.linkish{border:0;background:none;color:var(--a);font-weight:600;cursor:pointer;font-size:.86rem;padding:0}
.dev{display:grid;gap:4px;justify-items:center;padding-top:14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-2)}
.dev strong{font-family:var(--f-head);font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:#b8860b;
  background:linear-gradient(180deg,#fff3b0 0%,#f5d061 28%,#c9972b 55%,#8a5a12 78%,#e9c46a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 2px 1px rgba(90,55,5,.45))}
.dev .phone{display:inline-flex;gap:8px;align-items:center;direction:ltr;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.logout{border:0;cursor:pointer;margin-inline-start:auto}
footer .dev{border-top:0;padding-top:0}

/* elegant gold finish */
.card, ul.list, .stat, .ticker, .notice{border:1px solid var(--gold-line)}
.hero{background:linear-gradient(135deg,var(--a) 0%,var(--a2) 50%,var(--b) 100%);border:1.5px solid transparent;
  background:linear-gradient(135deg,var(--a) 0%,var(--a2) 50%,var(--b) 100%) padding-box,var(--gold-grad) border-box;box-shadow:0 14px 34px rgba(14,60,110,.28)}
.brand h1{letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero .glass{border:1px solid rgba(255,230,160,.35)}
.sec-head h2::after{content:"";display:inline-block;width:34px;height:3px;border-radius:3px;background:var(--gold-grad);margin-inline-start:4px}
.ico{background:var(--c);color:#fff;border-radius:50%!important;box-shadow:0 3px 8px color-mix(in oklab,var(--c) 38%,transparent)}
.ico svg,.ei svg{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ei{--c:#0f766e;display:inline-grid;place-items:center;flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--c);color:#fff;
  vertical-align:-.42em;margin-inline-end:.2em;box-shadow:0 2px 5px color-mix(in oklab,var(--c) 35%,transparent)}
.ei svg{width:62%;height:62%}
.prep-emo .ei,.father-ic .ei{width:100%;height:100%;margin:0;vertical-align:0}
.prep-emo:has(.ei){background:none;border:0;font-size:inherit}
.ic-btn{border:0!important;background:none!important;width:auto;height:auto}.ic-btn .ei{width:38px;height:38px;margin:0;vertical-align:0}
.btn .ei{width:1.45em;height:1.45em;vertical-align:-.4em}
.prep-list .emo .ei{width:30px;height:30px;vertical-align:-.3em}
.pw button.eye .ei{width:30px;height:30px;margin:0}
.ico .emo{font-family:var(--f-emoji);font-size:20px;line-height:1}
.ico.lg .emo{font-size:25px}
nav.tabs button .ico .emo{font-size:17px}
nav.tabs button[aria-current="page"] .ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
nav.tabs button:not([aria-current="page"]) .ico{opacity:.82}
nav.tabs button[aria-current="page"]{color:var(--gold-d)}
.btn{background:linear-gradient(135deg,var(--a),var(--a2) 60%,var(--b))}
.btn.gold{background:var(--gold-grad);color:#3b2a05}
.avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.gate-church{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold),var(--shadow)}
.rsec>summary::before,.reading .ref{color:var(--gold-d)}
.reading .ref{background:color-mix(in oklab,var(--gold) 14%,var(--surface))}
.rsub{color:#0e7490}
.stat:hover,ul.list li.click:hover{background:color-mix(in oklab,var(--gold) 6%,var(--surface))}
.emoji-h{font-family:var(--f-emoji)}
.pw button.eye{font-family:var(--f-emoji);font-size:1.2rem;line-height:1;padding:4px 6px}
.gate-cross{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold),0 10px 24px rgba(14,60,110,.25)}
.notice .btn.on{background:var(--brand-grad)}

/* confession preparation */
.prep{gap:12px}
.prep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}

.father-n{font-weight:700;color:var(--brand)}

.acc-group-h{margin:0 0 8px}

.contact-box{display:grid;gap:6px}
.wa-tpls{flex-wrap:wrap}

.pw-shown{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.pw-big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.8rem;font-weight:800;letter-spacing:.18em;text-align:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.stat .prep-emo{width:38px;height:38px;font-size:20px;border-radius:12px}
.or{text-align:center;color:var(--ink-2);font-weight:700;font-size:.85rem}

/* header: saint image + signed-in person */
.hero{grid-template-columns:1fr auto;align-items:start;column-gap:14px}
.hero-main{display:grid;gap:10px;min-width:0;position:relative;z-index:1}
.hero-side{display:grid;gap:10px;justify-items:center;position:relative;z-index:1}
.me-box{display:flex;align-items:center;gap:6px}

.band .hero .hero-logo,.band .hero .cross{grid-area:logo;align-self:start}

const CMONTHS = ["توت","بابه","هاتور","كيهك","طوبه","أمشير","برمهات","برموده","بشنس","بؤونه","أبيب","مسرى","النسيء"];
const COPTIC_EPOCH = 1825030;
function jdn(y,m,d){ const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3; return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045; }
const copticToJd = (y,m,d) => COPTIC_EPOCH-1+365*(y-1)+Math.floor(y/4)+30*(m-1)+d;
function toCoptic(date){
  const jd = jdn(date.getFullYear(), date.getMonth()+1, date.getDate());
  const y = Math.floor((4*(jd-COPTIC_EPOCH)+1463)/1461);
  const m = Math.floor((jd-copticToJd(y,1,1))/30)+1;
  return {y, m, d: jd+1-copticToJd(y,m,1)};
}
function copticEaster(y){
  const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  const month=Math.floor((d+e+114)/31), day=((d+e+114)%31)+1;
  const dt=new Date(y,month-1,day); dt.setDate(dt.getDate()+13); return dt;
}

function seasonOf(t){
  const c = toCoptic(t), E = copticEaster(t.getFullYear()), x = daysBetween(E, t);
  const m = t.getMonth()+1, d = t.getDate();
  if (x>=-69 && x<=-67) return "nineveh";
  if (x>=-55 && x<=-8) return "greatLent";
  if (x===-7) return "palm";
  if (x>=-6 && x<=-1) return "holyWeek";
  if (x>=0 && x<=49) return "khamseen";
  if (x>=50 && (m<7 || (m===7 && d<=11))) return "apostles";
  if (m===8 && d>=7 && d<=21) return "virgin";
  if (c.m===1 && c.d<=16) return "nayrouz";

function feastsOf(t){

const Store = {

// save on top of the latest copy on the server, so another device (or a screen that hasn't refreshed yet) never undoes a change:
// editDoc builds the new document from the fresh one; patchDoc writes only the fields a form changed
async function editDoc(path, fn){
  const cur = Object.assign({}, (await Store.get(path)) || {}); delete cur.id;
  return Store.set(path, clean(fn(cur)));
}
async function patchDoc(path, before, after){

}
const Mem = {
  data:new Map(), subs:new Set(),
  parent(p){ return p.split("/").slice(0,-1).join("/"); },
  snapshot(sub){
    const even = sub.path.split("/").length % 2 === 0;

    let rows = [];
    for (const [k,v] of this.data) if (this.parent(k) === sub.path) rows.push(Object.assign({id:k.split("/").pop()}, v));
    const o = sub.opts || {};
    if (o.orderBy){ const f=o.orderBy, s=o.dir==="desc"?-1:1; rows.sort((a,b)=> (a[f]>b[f]?1:a[f]<b[f]?-1:0)*s); }
    if (o.limit) rows = rows.slice(0, o.limit);

  },
  listen(path, opts, cb){ const sub={path,opts,cb}; this.subs.add(sub); queueMicrotask(()=>cb(this.snapshot(sub))); return ()=>this.subs.delete(sub); },
  notify(p){ for (const s of this.subs) if (s.path===p || s.path===this.parent(p)) s.cb(this.snapshot(s)); },

const REPS = [["w","كل أسبوع"],["2w","كل أسبوعين"],["10d","كل ١٠ أيام"],["m","مرة في الشهر"]];

function confessionChart(all){

  for (const p of all){

    for (const s of dates){ const d = parseYmd(s); const b = months.find(x=>x.y===d.getFullYear() && x.m===d.getMonth()); if (b) b.n++; }
  }
  const max = Math.max(1, ...months.map(x=>x.n)), W=600, H=200, pad=28, bw=(W-pad*2)/months.length;
  const colors = ["#3b82f6","#8b5cf6","#ec4899","#f97316","#14b8a6","#22c55e"];
  const ns="http://www.w3.org/2000/svg", svg=document.createElementNS(ns,"svg");

  const el=(t,a,txt)=>{ const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.append(e); return e; };
  el("line",{x1:pad,x2:W-pad,y1:H,y2:H,stroke:"currentColor","stroke-opacity":".15"});
  months.forEach((b,i)=>{
    const x = W-pad-(i+1)*bw+bw*.2, w = bw*.6, hgt = (H-30)*b.n/max, y = H-hgt;
    el("rect",{x, y, width:w, height:Math.max(hgt, b.n?2:0), rx:8, fill:colors[i]});
    el("text",{x:x+w/2, y:y-6, "text-anchor":"middle", "font-size":"15", "font-weight":"700", fill:"currentColor"}, arDigits(b.n));
    el("text",{x:x+w/2, y:H+20, "text-anchor":"middle", "font-size":"13", fill:"currentColor", "fill-opacity":".65"}, GMONTHS[b.m]);
  });
  return svg;
}

function resizeImage(file, max, cb){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const sc = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", .85)); };
  img.onerror = () => toast("هذه الصورة غير مناسبة");
  img.src = url;
}

  s.className = "ei"; s.style.setProperty("--c", e[1]); s.setAttribute("aria-hidden","true"); s.innerHTML = icSvg(e[0]); return s; }
const NO_ICON = /^(TEXTAREA|INPUT|SCRIPT|STYLE|OPTION|TITLE|SELECT|svg|path)$/;
function iconizeText(t){
  const v = t.nodeValue; if (!v || !t.parentNode || NO_ICON.test(t.parentNode.nodeName) || t.parentNode.closest && t.parentNode.closest("[data-noicon]")) return;

  render.scope = scope;

async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function keyOk(k){ return await sha256(String(k||"").trim()) === ACTIVATION_HASH; }
/* Passwords: PBKDF2-SHA256 with a per-password salt. Records saved by older versions (single salted SHA-256)
   still verify and are upgraded on the next successful login. */
const KDF_ITER = 120000;
async function pbkdf2(pw, salt, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:new TextEncoder().encode(salt), iterations:iter, hash:"SHA-256"}, km, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function makeHash(pw){ const salt = newId()+newId(); return {salt, hash: await pbkdf2(pw, salt, KDF_ITER), kdf:"pbkdf2", iter:KDF_ITER}; }
async function checkPw(rec, pw){
  if (!rec || !rec.hash || !rec.salt) return false;
  if (rec.kdf === "pbkdf2") return await pbkdf2(pw, rec.salt, rec.iter || KDF_ITER) === rec.hash;
  return await sha256(rec.salt+"|"+pw) === rec.hash;
}
/* Login throttling: after 5 wrong tries the gate waits, doubling each further round of 5 (max 10 minutes). */
const LOCK_KEY = "ruhiya_lock";
function lockGet(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)||"null") || {n:0, until:0}; } catch(e){ return lockGet.mem || {n:0, until:0}; } }
function lockPut(o){ lockGet.mem = o; try { localStorage.setItem(LOCK_KEY, JSON.stringify(o)); } catch(e){} }
function lockWait(){ const l = lockGet(); return Math.max(0, Math.ceil((l.until - Date.now())/1000)); }
function lockFail(){ const l = lockGet(); l.n = (l.n||0)+1; if (l.n >= 5) l.until = Date.now() + Math.min(600, 30 * 2 ** Math.floor((l.n-5)/5)) * 1000; lockPut(l); }
function lockOk(){ lockPut({n:0, until:0}); }

    h("div",{class:"dev-rule", "aria-hidden":"true"}, h("i"), "✦", h("i")),

}

const SLOW_MS = 5000;

function speedStats(){
  const wk = Date.now() - 7*864e5, rows = [];
  for (const d of S.speed || []){ const xs = (d.samples||[]).filter(x => x && x.at > wk && x.ms >= 0 && x.ms < 600000); if (!xs.length) continue;
    const ms = xs.map(x => x.ms).sort((a,b) => a-b);
    rows.push({id:d.id, name:d.name||"", n:xs.length, med:ms[Math.floor(ms.length/2)], last:xs[xs.length-1]}); }
  const all = rows.flatMap(r => (S.speed.find(d => d.id === r.id).samples||[]).filter(x => x && x.at > wk).map(x => x.ms));
  const avg = all.length ? all.reduce((a,b) => a+b, 0) / all.length : 0;
  return {rows:rows.sort((a,b) => b.med - a.med), avg, n:all.length};
}

/* ---------- boot ---------- */
async function boot(){
  applySeason();
  let db = null, user = null;
  try {
    if (window.claude && window.claude.use){ [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); }
  } catch(e){ db = null; }
  S.isOwner = user ? await user.isOwner() : false;
  S.realUid = user ? await user.id() : null;
  if (!window.claude){
    Store.mode = "cloud"; Store.ext = Cloud; PW_MIN = 6; S.role = "priest"; S.uid = S.realUid = null;
  } else if (db && S.realUid){
    Store.db = db; Store.mode = "live"; S.liveAvailable = true; S.uid = S.realUid;
    S.role = S.isOwner ? "priest" : "member";
  } else {
    Store.mode = "demo"; seedDemo(); S.role = "priest"; S.uid = "demo-me";
  }
  $("#devFooter").replaceChildren(devBlock(true));
  $("#logoutBtn").addEventListener("click", logout);
  applySettings(); try { const st = await Store.get("settings/app"); if (st){ S.settings = st; S.settingsFetched = true; applySettings(); } } catch(e){}
  if (Store.mode === "local"){ if (await restoreLocalSession()) unlock(); else showGate(); return; }
  if (Store.mode === "cloud"){ if (await restoreCloudSession()) unlock(); else showGate(); return; }
  const sess = ssGet(okKey()); if (sess){ S.authName = sess==="1" ? "" : sess; unlock(); } else showGate();
}

  put(v){ try { v ? localStorage.setItem(BIO_KEY, JSON.stringify(v)) : localStorage.removeItem(BIO_KEY); } catch(e){} },
  async can(){ try { return !!(window.PublicKeyCredential && isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } },

function cloudAccount(me){

  try { localStorage.setItem(CHURCH_KEY, me.slug); } catch(e){}
  S.fathers = me.fathers || [];
  return {id:me.uid, name:me.name, role:me.role, active:me.active, mustChange:me.must_change, photo:me.photo||"", lastLogin:me.last_login, logins:me.logins,
    father:me.father||"", fatherName:me.father_name||"", fatherPhoto:me.father_photo||"", confessor:!!me.confessor};
}
async function restoreCloudSession(){
  const s = Cloud.loadSess(); if (!s || !ssGet(okKey())) return false;
  Cloud.sess = s;
  try { const me = await Cloud.rpc("me"); if (!me || !me.active || me.must_change) throw new Error("x");
    Cloud.me = me; applyAccount(cloudAccount(me)); watchApproval(); return true; }
  catch(e){ Cloud.setSess(null); return false; }
}

        await logAct("فعّل الدخول بالبصمة"); toast("👆 البصمة اتفعّلت على الجهاز ده"); await finish(); }); }},

      extra = [h("button",{class:"linkish", type:"button", onclick:async()=>{ try { localStorage.setItem("ruhiya_bio_skip_"+Cloud.me.uid, "1"); } catch(x){} await finish(); }},"مش دلوقتي")];
    } else if (mode === "change"){
      sub = "أهلاً "+S.account.name+". كلمة السر دي اتعملتلك من حد تاني، فاختار كلمة سر خاصة بيك محدش يعرفها.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const pw = v("gPw"), strong = ["admin","priest"].includes(S.account.role);
        if (strong && pw.length < 8) fail("كلمة سر أبونا والأدمن لازم تكون "+arDigits(8)+" حروف أو أرقام على الأقل."); if (pw.length < PW_MIN) fail(pwShort()+"."); if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        await Cloud.setOwnPassword(pw); await Cloud.rpc("password_changed");
        await logAct("اختار كلمة سر جديدة"); S.account.mustChange = false; Cloud.me.must_change = false;
        toast("كلمة السر اتغيّرت"); await finish(); }); }},
        h("label",null,"كلمة السر الجديدة", pwInput("gPw","كلمة السر الجديدة","new-password")),
        h("label",null,"اكتبها تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("احفظ وادخل"));
      extra = [h("button",{class:"linkish", type:"button", onclick:async()=>{ await Cloud.signOut(); S.account = null; mode = "login"; draw(); }},"رجوع")];
    } else if (mode === "activate" && !lic){
      sub = "اكتب كود الرخصة اللي أخدته من المطوّر.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        licCode = v("gLic").trim(); if (!licCode) fail("اكتب كود الرخصة.");

        if (!lic){ lockFail(); fail("كود الرخصة غلط، أو اتفعّل قبل كده، أو خلص."); }
        lockOk(); draw(); }); }},
        h("label",null,"كود الرخصة", h("input",{id:"gLic", dir:"ltr", autocomplete:"off", placeholder:"RUH-XXXX-XXXX-XXXX"})),
        err, btn("تأكيد الكود"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ mode = slug ? "login" : "church"; draw(); }},"رجوع")];
    } else {
      sub = "الرخصة سليمة لـ «"+lic.name+"». اعمل حساب الأدمن، وبعد كده الأدمن يعمل حسابات أبونا والمشرفين والمستخدمين.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const name = v("gName").trim(), pw = v("gPw");
        if (!name || !pw) fail("اكتب الاسم وكلمة السر."); if (pw.length < 8) fail("كلمة سر الأدمن لازم تكون "+arDigits(8)+" حروف أو أرقام على الأقل."); if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        const email = await mailFor(lic.slug, name);
        try { await Cloud.signUp(email, pw); } catch(e){ if (!/already|exists/i.test(e.message)) throw e; }
        await Cloud.signIn(email, pw);
        await Cloud.rpc("claim_church", {p_code:licCode, p_name:name});
        slug = lic.slug; const me = await Cloud.rpc("touch_login"); lic = null;
        await enter(me); toast("الكنيسة اتفعّلت. كود الكنيسة: "+me.slug); }); }},
        h("div",{class:"notice"}, h("span",null, "كود الكنيسة: ", h("b",{dir:"ltr"}, lic.slug), " · الرخصة لحد "+fmtShort(lic.expires_at))),
        h("label",null,"اسم الأدمن", h("input",{id:"gName", autocomplete:"username", placeholder:"اكتب اسمك"})),
        h("label",null,"كلمة السر", pwInput("gPw","كلمة السر","new-password")),
        h("label",null,"اكتب كلمة السر تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("تفعيل الكنيسة وإنشاء حساب الأدمن"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ lic = null; draw(); }},"رجوع")];
    }
    gate.replaceChildren(gateCard([churchMark(), h("div",null, h("h1",null,title), h("p",{class:"muted small"}, sub))],
      [form, ...extra, h("p",{class:"small muted gate-note", style:"margin:0"},"🔒 بياناتك محفوظة على سيرفر الكنيسة، ومحدش بيشوفها غير اللي ليه صلاحية."), devBlock()]));
    const f = gate.querySelector("input"); if (f) f.focus();
  };
  draw();
}
// phone notifications (أبونا only): the public key comes from the «menrit-push» Edge Function; the subscription is kept by save_push
// أبونا's private calendar link (2026-11-05): the same function serves it as an .ics his phone's calendar subscribes to
// «🆕 الجديد»: who already read this update's news is kept on the server (accounts.news_seen)
newsApi = {
  seen(){ return (Cloud.me && Cloud.me.news_seen) || ""; },
  async mark(id){ await Cloud.rpc("set_news_seen", {p_id:id}); if (Cloud.me) Cloud.me.news_seen = id; }
};

// fixing someone's national ID (his own father or the admin)
childApi = { async set(uid, data){ const r = await Cloud.rpc("child_profile_set", {p_uid:uid, p_data:data}); Cloud.refresh("members/x"); Cloud.refresh("pending/x"); Cloud.refresh("nid_dupes/x"); return r; } };
// «إزالة من أولادي» (2026-11-07): the father lets go of a confessee; his notes about him are deleted
releaseApi = { async child(uid){ await Cloud.rpc("release_child", {p_uid:uid}); Cloud.refresh("members/x"); Cloud.refresh("accounts/x"); Cloud.refresh(PP()+"/x"); } };
nidApi = { async set(uid, nid){ await Cloud.rpc("set_nid", {p_uid:uid, p_nid:nid}); Cloud.refresh("members/x"); Cloud.refresh("pending/x"); Cloud.refresh("nid_dupes/x"); } };
// asking to move to another confession father (2026-11-05): the confessee asks, only the admin answers
freqApi = {
  async create(to, reason){ await Cloud.rpc("freq_create", {p_to:to, p_reason:reason}); Cloud.refresh("freqmine/x"); },
  async cancel(){ await Cloud.rpc("freq_cancel"); Cloud.refresh("freqmine/x"); },
  async answer(id, okk, reply){ await Cloud.rpc("freq_answer", {p_id:id, p_ok:okk, p_reply:reply||""}); Cloud.refresh("freq/x"); Cloud.refresh("accounts/x"); }
};
// passport instead of the national ID (2026-11-05): the admin makes a one-time code, the person uses it with the passport number
passportApi = {
  make(note){ return Cloud.rpc("passport_new", {p_note:note||""}); },
  list(){ return Cloud.rpc("passport_list"); },
  drop(code){ return Cloud.rpc("passport_drop", {p_code:code}); },
  async use(code, passport){ const r = await Cloud.rpc("passport_use", {p_code:code, p_passport:passport}); if (r && r.error) throw new Error(r.error); const me = Cloud.sess && Cloud.sess.uid; if (me) Cloud.refresh("members/"+me); return r; }
};
signupApi = {
  get(){ return Cloud.rpc("signup_get"); },
  set(open, fresh){ return Cloud.rpc("signup_set", {p_open:open, p_new_code:!!fresh}); }
};
calApi = {
  async link(){ const t = await Cloud.rpc("cal_link"); return SB + "/functions/v1/menrit-push?cal=" + t; },
  async reset(){ const t = await Cloud.rpc("cal_reset"); return SB + "/functions/v1/menrit-push?cal=" + t; }
};
pushApi = {
  fn: SB + "/functions/v1/menrit-push",
  supported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; },
  ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  standalone(){ try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch(e){ return false; } },
  async current(){ if (!this.supported()) return null; const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; },
  keyOf(k){ return Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0)); },
  async status(){ const s = await this.current(); if (!s) return {on:false};
    let st = await Cloud.rpc("push_status", {p_endpoint:s.endpoint}).catch(() => ({on:false})) || {on:false};
    // (2026-11-06) the server forgot this phone (an expired or renewed registration) while it still has permission: register it again quietly
    try { if (!st.on && Notification.permission === "granted" && localStorage.getItem("menrit_push_on") === "1"){ await this.enable(); return {on:true, renewed:true}; } if (st.on) localStorage.setItem("menrit_push_on", "1"); } catch(e){}
    // the notification key changed on the server: subscribe again quietly, or the phone would stop getting them
    try { if (st.on && Notification.permission === "granted" && s.options && s.options.applicationServerKey){
      const r = await fetch(this.fn).then(x => x.ok ? x.json() : null).catch(() => null);
      if (r && r.key && new Uint8Array(s.options.applicationServerKey).join() !== this.keyOf(r.key).join()){ await this.enable(); return {on:true, renewed:true}; } } } catch(e){}
    return st; },
  async enable(){
    const ui = m => { const e = new Error(m); e.ui = true; return e; };
    const r = await fetch(this.fn).then(x => x.ok ? x.json() : null).catch(() => null);
    if (!r || !r.key) throw ui("التنبيهات لسه متجهزتش على السيرفر. كلّم الأدمن.");
    if (await Notification.requestPermission() !== "granted") throw ui("لازم توافق على الإشعارات عشان التنبيهات توصلك.");
    const reg = await navigator.serviceWorker.ready;
    const key = this.keyOf(r.key);
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey && new Uint8Array(sub.options.applicationServerKey).join() !== key.join()){ await sub.unsubscribe().catch(()=>{}); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
    const j = sub.toJSON();
    await Cloud.rpc("save_push", {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth});
    try { localStorage.setItem("menrit_push_on", "1"); } catch(e){}
  },
  // «📨 تجربة التنبيه»: registers this phone again when needed, then asks the server to send a test notification
  async test(){
    let s = await this.current(), r = await Cloud.rpc("push_test", {p_endpoint:s ? s.endpoint : ""});
    if (r && r.server && !r.here && Notification.permission === "granted"){ await this.enable(); s = await this.current(); r = await Cloud.rpc("push_test", {p_endpoint:s ? s.endpoint : ""}); }
    return r || {}; },
  async disable(){ try { localStorage.removeItem("menrit_push_on"); } catch(e){} const s = await this.current(); if (s){ await Cloud.rpc("drop_push", {p_endpoint:s.endpoint}).catch(()=>{}); await s.unsubscribe().catch(()=>{}); } }
};
// أسرة الأب الكاهن: the person asks, that أبونا answers; the server keeps it (priest_family)
pfamApi = {
  async set(uid){ await Cloud.rpc("set_priest_family", {p_priest:uid || null}); Cloud.refresh("pfam"); },

};

// how long the app took to show its data on this phone (2026-11-07): the last 10 times, kept for the admin's «سرعة التحميل» card
speedApi = {
  async save(ms, cached){
    if (!Cloud.me || Store.preview || !Cloud.church()) return;
    const k = "menrit_speed_"+Cloud.me.uid; let list = [];
    try { list = JSON.parse(localStorage.getItem(k) || "[]"); } catch(e){}
    list = (Array.isArray(list) ? list : []).filter(x => x && x.at > Date.now() - 14*864e5).slice(-9);
    list.push({ms:Math.round(ms), at:Date.now(), net:(navigator.connection && navigator.connection.effectiveType) || "", cached:cached ? 1 : 0});
    try { localStorage.setItem(k, JSON.stringify(list)); } catch(e){}
    const body = JSON.stringify({church_id:Cloud.church(), path:"speed/"+Cloud.me.uid, data:{name:Cloud.me.name, role:Cloud.me.role, samples:list}});
    await Cloud.req("/rest/v1/docs?on_conflict=church_id,path", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body}).catch(() => {});
  }
};

boot();
