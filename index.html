<style>
/* Layout: a modern mobile app. A season-coloured gradient card opens the page, white rounded cards hold each screen,
   every section and tab carries its own coloured icon tile, and the nav is a bottom app bar on phones. */
:root{
  --a:#0f766e; --b:#1e40af;
  --bg:#f6efe1; --surface:#fffdf8; --surface-2:#fbf5e9; --line:#ebe1cc;
  --ink:#172033; --ink-2:#64708a; --on-a:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#e11d48;
  --shadow:0 1px 2px rgba(23,32,51,.05), 0 6px 20px rgba(23,32,51,.06);
  --f-head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-scripture:"Amiri","Noto Naskh Arabic",serif;
  --nav-h:68px; --r:20px;
  --gold:#c9a227; --gold-2:#e9c96b; --gold-d:#8a6414;
  --gold-grad:linear-gradient(135deg,#fff1a8,#d4a630 30%,#8a5a12 50%,#f2d06b 70%,#a8741a);
  --gold-line:color-mix(in oklab,var(--gold) 45%,transparent);
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.22rem} h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.85}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in oklab,var(--gold) 20%,transparent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:5px;font-size:.86rem;color:var(--ink-2);font-weight:600}
a{color:var(--a);font-weight:600}
.btn{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on-a);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700;white-space:nowrap;
  box-shadow:0 4px 14px color-mix(in oklab,var(--a) 30%,transparent)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:color-mix(in oklab,var(--a) 12%,var(--surface));color:var(--a);box-shadow:none}
.btn.quiet{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:4px 12px;font-size:.84rem;border-radius:10px}

/* colourful icon tiles */
.ico{--c:#64708a;display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:11px;
  background:color-mix(in oklab,var(--c) 15%,var(--surface));color:var(--c)}
.ico svg{width:20px;height:20px}
.ico.lg{width:44px;height:44px;border-radius:14px}.ico.lg svg{width:24px;height:24px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 30px color-mix(in oklab,var(--a) 30%,transparent);display:grid;gap:10px}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;inset-inline-end:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.cross{width:40px;height:40px;padding:7px;border-radius:12px;background:rgba(255,255,255,.2);color:#fff}
.brand{display:grid}
.brand .eyebrow{font-size:.8rem;opacity:.9;font-weight:600}
.brand h1{font-size:1.6rem;color:#fff}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.glass{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;color:#fff;display:inline-flex;gap:6px;align-items:center}
.coptic{font-family:var(--f-head);font-weight:800;font-size:1rem}
#gregDate{opacity:.95}
.season-chip i{width:8px;height:8px;border-radius:50%;background:#fff}
#feastLine{position:relative;z-index:1;font-weight:700}
#feastLine:empty{display:none}
#noticeSlot:empty{display:none}
.notice{color:var(--ink);margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.notice .btn{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.notice .btn.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px;background:var(--bg)}
nav.tabs .wrap{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
nav.tabs button{position:relative;border:0;background:var(--surface);box-shadow:var(--shadow);padding:5px 14px 5px 6px;border-radius:14px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;font-weight:700;font-family:var(--f-head)}
nav.tabs button .ico{width:30px;height:30px;border-radius:10px}
nav.tabs button .ico svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ico{background:var(--c);color:#fff}
nav.tabs .badge{min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;font-weight:700}
@media (max-width:720px){
  nav.tabs{position:fixed;inset:auto 0 0 0;top:auto;background:var(--surface);padding:6px max(6px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px));
    box-shadow:0 -4px 20px rgba(23,32,51,.08);border-top:1px solid var(--line)}
  nav.tabs .wrap{flex-wrap:nowrap;justify-content:space-around;gap:0}
  nav.tabs button{flex:1;flex-direction:column;gap:2px;padding:2px;font-size:.7rem;box-shadow:none;background:transparent}
  nav.tabs .badge{position:absolute;top:-2px;inset-inline-start:calc(50% + 8px)}
}

main{display:grid;gap:18px}
section{display:grid;gap:10px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.sec-head h2{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:start;color:var(--ink);justify-items:start}
.stat b{font-family:var(--f-head);font-size:1.8rem;font-weight:800;line-height:1}
.stat span:last-child{font-size:.8rem;color:var(--ink-2);font-weight:600}
.stat.alert b{color:var(--bad)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}}

ul.list{list-style:none;margin:0;padding:4px 0;display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
ul.list li{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
ul.list li:first-child{border-top:0}
ul.list li.click{cursor:pointer}
ul.list li.click:hover{background:var(--surface-2)}
.who{display:grid;min-width:0}
.who strong{font-weight:700}
.pill{display:inline-block;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:600;line-height:24px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:color-mix(in oklab,var(--warn) 15%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in oklab,var(--bad) 15%,var(--surface));color:var(--bad)}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,var(--surface));color:var(--ok)}
.pill.acc{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center;font-weight:600}
.family-head{font-family:var(--f-head);font-weight:800;font-size:.95rem;color:var(--a)}

.reading{display:grid;gap:6px}
.reading .ref{display:inline-block;width:max-content;font-size:.76rem;font-weight:700;color:#0d9488;background:color-mix(in oklab,#14b8a6 14%,var(--surface));padding:0 10px;border-radius:999px}
.auto-read{display:grid;gap:10px}
.rsec{border:1px solid var(--gold-line);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.rsec>summary{cursor:pointer;list-style:none;font-weight:700}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary::before{content:"▸ ";color:#0d9488}
.rsec[open]>summary::before{content:"▾ "}
.rsub{margin:6px 0 0;font-size:.95rem;color:#0f766e}
.syn{font-family:var(--f-body)!important;font-size:1.02rem!important}
.reading .text{font-family:var(--f-scripture);font-size:1.18rem;line-height:2;white-space:pre-wrap;max-width:65ch}
.medit{display:grid;gap:6px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,color-mix(in oklab,#8b5cf6 10%,var(--surface)),color-mix(in oklab,#ec4899 8%,var(--surface)))}
.medit h3{color:#8b5cf6}
.medit .text{font-family:var(--f-scripture);font-size:1.22rem;line-height:2;white-space:pre-wrap;max-width:60ch}

.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:#22c55e;flex:none}
.check:has(input:checked){border-color:var(--gold);background:color-mix(in oklab,#22c55e 10%,var(--surface))}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.68rem;color:var(--ink-2);font-weight:600}
.day.l1{background:color-mix(in oklab,#22c55e 30%,var(--surface))}
.day.l2{background:color-mix(in oklab,#22c55e 62%,var(--surface));color:#fff}
.day.l3{background:#16a34a;color:#fff}
.detail{outline:0;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:20}
footer{margin-top:24px;font-size:.8rem;color:var(--ink-2);text-align:center}
@media (max-width:480px){.days{gap:2px}}

/* verse ticker + welcome (from the service program) */
.ticker{margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:center;min-height:46px;display:grid;place-items:center}
#verse{font-family:var(--f-scripture);font-size:1.08rem;font-weight:700;line-height:1.7;transition:opacity .45s}
.welcome{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;position:relative;z-index:1;font-weight:700}
#liveClock{font-size:.84rem;opacity:.95;font-variant-numeric:tabular-nums}
.hero-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
body.locked .ticker{display:none}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--a);background:color-mix(in oklab,var(--a) 10%,var(--surface))}
.kid-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center}
@media (max-width:480px){.kid-row{grid-template-columns:1fr 1fr auto}}
.warnbox{background:color-mix(in oklab,var(--warn) 12%,var(--surface));color:var(--warn);border-radius:14px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dev-id{display:inline-flex;align-items:center;gap:8px}
.dev-id img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.gate-church{width:120px;height:120px;max-width:100%;border-radius:50%;object-fit:cover;margin:0 auto;box-shadow:var(--shadow);background:#fff}
.gate-cross{width:96px;height:96px;margin:0 auto;border-radius:28px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.gate-cross svg{width:56px;height:56px}
.gate-priest{font-family:var(--f-head);font-weight:700;color:var(--a);font-size:1rem}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:1.1rem;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px color-mix(in oklab,var(--a) 45%,transparent)}
.avatar.lg{width:96px;height:96px;font-size:2.2rem}
.person-line{display:flex;align-items:center;gap:12px;min-width:0}
.photo-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
/* login gate */
body.locked .band, body.locked nav.tabs, body.locked main, body.locked footer{display:none}
#gate{min-height:calc(100dvh - 32px);display:grid;place-items:center;padding-block:12px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border-radius:26px;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#fff1a8,#d4a630 30%,#8a5a12 50%,#f2d06b 70%,#a8741a) border-box;box-shadow:0 0 0 1px rgba(138,90,18,.25),0 0 0 6px color-mix(in oklab,#d4a630 18%,transparent),var(--shadow);padding:26px 22px 20px;display:grid;gap:16px;text-align:center}
.gate-logo{width:132px;height:132px;max-width:100%;border-radius:50%;object-fit:cover;margin:0 auto;box-shadow:0 8px 24px rgba(110,24,52,.18)}
.gate-card h1{font-size:1.5rem}
.gate-mark{display:grid;gap:10px;justify-items:center}
.pending-wait{display:flex;gap:14px;align-items:center;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.pending-wait .prep-emo{font-size:2rem}
.pending-card{display:grid;gap:10px;border:2px solid transparent;background:linear-gradient(color-mix(in oklab,#06b6d4 7%,var(--surface)),color-mix(in oklab,#06b6d4 7%,var(--surface))) padding-box,var(--gold-grad) border-box}
.seg{display:flex;gap:6px;background:var(--surface);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-family:var(--f-head);font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button[aria-selected="true"]{background:linear-gradient(135deg,#0f766e,#1e40af);color:#fff;box-shadow:0 0 0 2px var(--gold) inset}
.cal{display:grid;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.cal-nav{border:1.5px solid var(--gold-line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:1.3rem;font-weight:800;cursor:pointer;color:var(--a)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:.7rem;font-weight:700;color:var(--ink-2);text-align:center;padding-bottom:2px}
.cal-day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;display:grid;place-items:center;align-content:center;gap:0;padding:3px 0;cursor:pointer;color:var(--ink);line-height:1.15}
.cal-day b{font-size:.98rem;font-family:var(--f-head)}
.cal-day small{font-size:.62rem;color:var(--gold-d);font-weight:700}
.cal-day.wk{background:color-mix(in oklab,#f43f5e 6%,var(--surface))}
.cal-day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal-day.on{background:linear-gradient(135deg,#0f766e,#1e40af);color:#fff;border-color:transparent}
.cal-day.on small{color:#fde68a}
.cal-day:disabled{opacity:.3;cursor:default}
.pick-day{font-weight:700;color:var(--a);margin:0}
.slot-row .chip-btn{padding:6px 12px}
.req-note{border-inline-start:4px solid var(--gold);background:color-mix(in oklab,var(--gold) 9%,var(--surface));border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.req-note span{font-size:.78rem;font-weight:700;color:var(--gold-d)}
@media (max-width:380px){.cal-day{min-height:40px}.cal-day b{font-size:.88rem}.cal-grid{gap:3px}}
.gate-photo{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;overflow:hidden;border:3px solid var(--gold);background:color-mix(in oklab,var(--gold) 10%,var(--surface));font-size:2.6rem;box-shadow:0 6px 18px rgba(15,118,110,.18)}
.gate-photo img{width:100%;height:100%;object-fit:cover}
.bio-art{font-size:3rem;text-align:center;line-height:1}
.bio-btn{background:linear-gradient(135deg,#7c3aed,#1e40af)!important}

/* ---------- Coptic calendar ---------- */
const CMONTHS = ["توت","بابه","هاتور","كيهك","طوبه","أمشير","برمهات","برموده","بشنس","بؤونه","أبيب","مسرى","النسيء"];
const COPTIC_EPOCH = 1825030;
function jdn(y,m,d){ const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3; return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045; }
const copticToJd = (y,m,d) => COPTIC_EPOCH-1+365*(y-1)+Math.floor(y/4)+30*(m-1)+d;
function toCoptic(date){
  const jd = jdn(date.getFullYear(), date.getMonth()+1, date.getDate());
  const y = Math.floor((4*(jd-COPTIC_EPOCH)+1463)/1461);
  const m = Math.floor((jd-copticToJd(y,1,1))/30)+1;
  return {y, m, d: jd+1-copticToJd(y,m,1)};
}
function copticEaster(y){
  const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  const month=Math.floor((d+e+114)/31), day=((d+e+114)%31)+1;
  const dt=new Date(y,month-1,day); dt.setDate(dt.getDate()+13); return dt;
}

function seasonOf(t){
  const c = toCoptic(t), E = copticEaster(t.getFullYear()), x = daysBetween(E, t);
  const m = t.getMonth()+1, d = t.getDate();
  if (x>=-69 && x<=-67) return "nineveh";
  if (x>=-55 && x<=-8) return "greatLent";
  if (x===-7) return "palm";
  if (x>=-6 && x<=-1) return "holyWeek";
  if (x>=0 && x<=49) return "khamseen";
  if (x>=50 && (m<7 || (m===7 && d<=11))) return "apostles";
  if (m===8 && d>=7 && d<=21) return "virgin";
  if (c.m===1 && c.d<=16) return "nayrouz";
  if (c.m===1 && c.d<=19) return "cross";
  if ((m===11 && d>=25) || m===12 || (m===1 && d<=6)) return c.m===4 ? "kiahk" : "nativityFast";
  if (m===1 && d<=21) return "nativity";
  return "ordinary";
}
const FIXED_FEASTS = {"1-1":"عيد النيروز (رأس السنة القبطية)","1-17":"عيد الصليب المجيد","6-8":"دخول المسيح الهيكل","7-29":"عيد البشارة","9-24":"دخول السيد المسيح أرض مصر","11-5":"استشهاد الرسولين بطرس وبولس","12-13":"عيد التجلي","12-16":"عيد صعود جسد السيدة العذراء"};
const MOVABLE = {"-7":"أحد الشعانين","-3":"خميس العهد","-2":"الجمعة العظيمة","0":"عيد القيامة المجيد","39":"عيد الصعود","49":"عيد العنصرة"};
function feastsOf(t){
  const c = toCoptic(t), out = [];
  const mv = MOVABLE[String(daysBetween(copticEaster(t.getFullYear()), t))]; if (mv) out.push(mv);
  if (FIXED_FEASTS[c.m+"-"+c.d]) out.push(FIXED_FEASTS[c.m+"-"+c.d]);
  const g = (t.getMonth()+1)+"-"+t.getDate();
  if (g==="1-7") out.push("عيد الميلاد المجيد"); if (g==="1-19") out.push("عيد الغطاس المجيد"); if (g==="1-21") out.push("عرس قانا الجليل");
  if (c.d===12) out.push("تذكار رئيس الملائكة ميخائيل");
  if (c.d===21) out.push("تذكار السيدة العذراء");
  if (c.d===29 && c.m!==5 && c.m!==6) out.push("تذكار الأعياد السيدية");
  return out;
}

/* ---------- data layer: live db or in-page demo ---------- */
const Store = {
  mode:"demo", db:null, ext:null, onErr(e){ console.warn(e); },
  listen(path, opts, cb){
    if (this.ext) return this.ext.listen(path, opts, cb);
    if (this.mode === "live"){
      const even = path.split("/").length % 2 === 0;
      if (even) return this.db.doc(path).onSnapshot(s => cb(s.exists ? Object.assign({id:s.id}, s.data()) : null), this.onErr);
      let q = this.db.collection(path);
      if (opts && opts.orderBy) q = q.orderBy(opts.orderBy, opts.dir || "asc");
      if (opts && opts.limit) q = q.limit(opts.limit);
      return q.onSnapshot(s => cb(s.docs.map(d => Object.assign({id:d.id}, d.data()))), this.onErr);
    }
    return Mem.listen(path, opts, cb);
  },
  async list(path){ if (this.ext) return this.ext.list(path); if (this.mode==="live"){ const s = await this.db.collection(path).get(); return s.docs.map(d=>Object.assign({id:d.id}, d.data())); } return Mem.snapshot({path}); },
  async get(path){ if (this.ext) return this.ext.get(path); if (this.mode==="live"){ const d = await this.db.doc(path).get(); return d.exists ? d.data() : null; } const v = Mem.data.get(path); return v ? JSON.parse(JSON.stringify(v)) : null; },
  async set(path, data){ if (this.ext) return this.ext.set(path, data); return this.mode==="live" ? this.db.doc(path).set(data) : Mem.set(path, data); },
  async update(path, data){ if (this.ext) return this.ext.update(path, data); return this.mode==="live" ? this.db.doc(path).update(data) : Mem.set(path, Object.assign({}, Mem.data.get(path)||{}, data)); },
  async del(path){ if (this.ext) return this.ext.del(path); return this.mode==="live" ? this.db.doc(path).delete() : Mem.del(path); }
};
const Mem = {
  data:new Map(), subs:new Set(),
  parent(p){ return p.split("/").slice(0,-1).join("/"); },
  snapshot(sub){
    const even = sub.path.split("/").length % 2 === 0;
    if (even){ const v = this.data.get(sub.path); return v ? Object.assign({id:sub.path.split("/").pop()}, v) : null; }
    let rows = [];
    for (const [k,v] of this.data) if (this.parent(k) === sub.path) rows.push(Object.assign({id:k.split("/").pop()}, v));
    const o = sub.opts || {};
    if (o.orderBy){ const f=o.orderBy, s=o.dir==="desc"?-1:1; rows.sort((a,b)=> (a[f]>b[f]?1:a[f]<b[f]?-1:0)*s); }
    if (o.limit) rows = rows.slice(0, o.limit);
    return rows;
  },
  listen(path, opts, cb){ const sub={path,opts,cb}; this.subs.add(sub); queueMicrotask(()=>cb(this.snapshot(sub))); return ()=>this.subs.delete(sub); },
  notify(p){ for (const s of this.subs) if (s.path===p || s.path===this.parent(p)) s.cb(this.snapshot(s)); },
  set(p, v){ this.data.set(p, JSON.parse(JSON.stringify(v))); this.notify(p); },
  del(p){ this.data.delete(p); this.notify(p); }
};

function merged(){
  const map = new Map();
  const waiting = new Set((S.pending||[]).map(x=>x.id));
  for (const m of S.members) if (!String(m.id).startsWith("preview-") && !waiting.has(m.id)) map.set(m.id, {id:m.id, onApp:true, self:m, name:m.name});
  for (const p of S.people){
    if (String(p.id).startsWith("preview-")) continue;
    const e = map.get(p.id) || {id:p.id, onApp:!!p.onApp, self:null};
    Object.assign(e, {pr:p, name:p.name || (e.self && e.self.name) || "بدون اسم"});
    map.set(p.id, e);
  }
  return [...map.values()].map(e => {
    const s = e.self || {}, p = e.pr || {};
    return Object.assign(e, {
      name: p.name || s.name || "بدون اسم", phone: p.phone || s.phone || "",
      birthday: p.birthday || s.birthday || "", wedding: p.wedding || s.wedding || "", spouse: p.spouse || s.spouse || "",

      photo: p.photo || s.photo || "", area: p.area || "", address: p.address || "", job: p.job || "", children: p.children || [], visits: p.visits || [], confessions: p.confessions || [],
      request: s.request && s.request.id !== p.handledRequest ? s.request : null,
      visitReq: s.visitReq && s.visitReq.id !== p.handledVisit ? s.visitReq : null, isNew: e.onApp && !e.pr
    });
  }).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
}
function nextOccurrence(s){
  const d = parseYmd(s); if (!d) return null;
  let n = new Date(TODAY.getFullYear(), d.getMonth(), d.getDate()); if (n < TODAY) n.setFullYear(n.getFullYear()+1);
  return {date:n, inDays:daysBetween(TODAY,n), years:n.getFullYear()-d.getFullYear()};
}
function occasions(people, within){
  const out = [];
  for (const p of people){
    for (const [k,label] of [["birthday","عيد ميلاد"],["wedding","عيد جواز"]]){
      const o = nextOccurrence(p[k]); if (o && o.inDays <= within) out.push({p, kind:k, label, ...o});
    }
    for (const c of (p.children||[])){ const o = nextOccurrence(c.birthday); if (o && c.name && o.inDays <= within) out.push({p, kind:"child", child:c.name, label:"عيد ميلاد "+c.name+" (من أولاد "+p.name.split(" ")[0]+")", ...o}); }
  }
  return out.sort((a,b)=>a.inDays-b.inDays);
}

function htmlText(s){
  if (!s) return "";
  const d = new DOMParser().parseFromString(String(s), "text/html");
  const ps = [...d.body.querySelectorAll("p")].map(p=>p.textContent.trim()).filter(Boolean);
  return ps.length ? ps.join("\n\n") : d.body.textContent.trim();

function parseKatameros(j){
  const rd = r => ({title:r.title||"", intro:htmlText(r.introduction), concl:htmlText(r.conclusion), body:htmlText(r.html),
    passages:(r.passages||[]).map(p=>({ref:(p.bookTranslation||"")+" \u2066"+(p.ref||"")+"\u2069", text:(p.verses||[]).map(v=>v.text).join(" ")}))});
  // The liturgy (قداس) nests البولس…السنكسار…الإنجيل as subsections, sometimes deeper; every block that holds
  // several subsections is opened out so each reading, the synaxarium included, gets its own section.
  const out = [];
  const walk = (node, parent) => {
    const subs = node.subSections || [];
    const title = node.title || "", intro = htmlText(node.introduction);
    if (subs.length > 1 || subs.some(x => x.subSections && x.subSections.length)){
      if ((node.readings||[]).length) out.push({title, intro, subs:[{title:"", intro:"", readings:node.readings.map(rd)}]});
      subs.forEach(x => walk(x, title));
    } else if (subs.length === 1){
      const x = subs[0];
      out.push({title: parent ? title : title, intro, subs:[{title:(x.title && x.title!==title) ? x.title : "", intro:htmlText(x.introduction), readings:(x.readings||[]).map(rd)}]});
    } else {
      out.push({title, intro, subs:[{title:"", intro:"", readings:(node.readings||[]).map(rd)}]});
    }

function confessionChart(all){
  const months = [];
  for (let i=5;i>=0;i--){ const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1); months.push({y:d.getFullYear(), m:d.getMonth(), n:0}); }
  for (const p of all){
    const dates = (p.confessions && p.confessions.length) ? p.confessions : (p.lastConfession ? [p.lastConfession] : []);
    for (const s of dates){ const d = parseYmd(s); const b = months.find(x=>x.y===d.getFullYear() && x.m===d.getMonth()); if (b) b.n++; }
  }
  const max = Math.max(1, ...months.map(x=>x.n)), W=600, H=200, pad=28, bw=(W-pad*2)/months.length;
  const colors = ["#3b82f6","#8b5cf6","#ec4899","#f97316","#14b8a6","#22c55e"];
  const ns="http://www.w3.org/2000/svg", svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+(H+30)); svg.setAttribute("role","img"); svg.setAttribute("aria-label","عدد الاعترافات في كل شهر");
  const el=(t,a,txt)=>{ const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.append(e); return e; };
  el("line",{x1:pad,x2:W-pad,y1:H,y2:H,stroke:"currentColor","stroke-opacity":".15"});
  months.forEach((b,i)=>{
    const x = W-pad-(i+1)*bw+bw*.2, w = bw*.6, hgt = (H-30)*b.n/max, y = H-hgt;
    el("rect",{x, y, width:w, height:Math.max(hgt, b.n?2:0), rx:8, fill:colors[i]});
    el("text",{x:x+w/2, y:y-6, "text-anchor":"middle", "font-size":"15", "font-weight":"700", fill:"currentColor"}, arDigits(b.n));
    el("text",{x:x+w/2, y:H+20, "text-anchor":"middle", "font-size":"13", fill:"currentColor", "fill-opacity":".65"}, GMONTHS[b.m]);
  });
  return svg;
}

async function collectBackup(){
  const docs = {};
  const add = async (col) => { for (const d of await Store.list(col)){ const {id, ...rest} = d; docs[col+"/"+id] = rest; } };
  for (const c of ["settings","meditations","readings","members","priest/main/people","accounts"]) await add(c);
  for (const k of Object.keys(docs)) if (/^members\/[^/]+$/.test(k)){ await add(k+"/inbox"); await add(k+"/notebook"); }
  const meta = await Store.get("priest/meta"); if (meta) docs["priest/meta"] = meta;
  return {app:"ruhiya", version:1, created:new Date().toISOString(), docs};
}
// Restore writes only the app's own collections. Accounts come back only for an admin, and never the
// signed-in admin's own record, so a restored file cannot change who is admin or lock the admin out.
const RESTORE_OK = /^(settings\/app|meditations\/[^/]+|readings\/[^/]+|priest\/meta|priest\/main\/people\/[^/]+|members\/[^/]+(\/(inbox|notebook)\/[^/]+)?|accounts\/[^/]+)$/;
async function restoreDocs(docs){
  let n = 0;
  for (const [k, v] of Object.entries(docs || {})){
    if (!RESTORE_OK.test(k) || !v || typeof v !== "object") continue;
    if (k.startsWith("accounts/") && (Store.mode === "cloud" || accRole() !== "admin" || k === "accounts/"+S.account.id)) continue;
    await Store.set(k, v); n++;
  }
  if (S.account) await logAct("رجّع نسخة احتياطية ("+n+" سجل)");
  return n;
}

function resizeImage(file, max, cb){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const sc = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", .85)); };
  img.onerror = () => toast("الصورة دي مش هتنفع");
  img.src = url;
}

async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function keyOk(k){ return await sha256(String(k||"").trim()) === ACTIVATION_HASH; }
/* Passwords: PBKDF2-SHA256 with a per-password salt. Records saved by older versions (single salted SHA-256)
   still verify and are upgraded on the next successful login. */
const KDF_ITER = 120000;
async function pbkdf2(pw, salt, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:new TextEncoder().encode(salt), iterations:iter, hash:"SHA-256"}, km, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function makeHash(pw){ const salt = newId()+newId(); return {salt, hash: await pbkdf2(pw, salt, KDF_ITER), kdf:"pbkdf2", iter:KDF_ITER}; }
async function checkPw(rec, pw){
  if (!rec || !rec.hash || !rec.salt) return false;
  if (rec.kdf === "pbkdf2") return await pbkdf2(pw, rec.salt, rec.iter || KDF_ITER) === rec.hash;
  return await sha256(rec.salt+"|"+pw) === rec.hash;
}
/* Login throttling: after 5 wrong tries the gate waits, doubling each further round of 5 (max 10 minutes). */
const LOCK_KEY = "ruhiya_lock";
function lockGet(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)||"null") || {n:0, until:0}; } catch(e){ return lockGet.mem || {n:0, until:0}; } }
function lockPut(o){ lockGet.mem = o; try { localStorage.setItem(LOCK_KEY, JSON.stringify(o)); } catch(e){} }
function lockWait(){ const l = lockGet(); return Math.max(0, Math.ceil((l.until - Date.now())/1000)); }
function lockFail(){ const l = lockGet(); l.n = (l.n||0)+1; if (l.n >= 5) l.until = Date.now() + Math.min(600, 30 * 2 ** Math.floor((l.n-5)/5)) * 1000; lockPut(l); }
function lockOk(){ lockPut({n:0, until:0}); }

function cloudMsg(e){

  if (/already registered|already exists|already a member|duplicate key/i.test(m)) return "فيه حساب بالاسم ده.";
  if (/licence expired/.test(m)) return "رخصة الكنيسة خلصت. كلّم المطوّر على "+DEV.phone+".";
  if (/bad code/.test(m)) return "كود الرخصة غلط.";
  if (/register_self|pending_list|review_account/.test(m) && /function|schema cache|does not exist/i.test(m)) return "التسجيل الجديد لسه مش متفعّل على السيرفر. كلّم المطوّر على "+DEV.phone+".";
  if (/no church/.test(m)) return "الكنيسة دي لسه ما اتفعّلتش.";
  if (/bad name/.test(m)) return "اكتب اسمك صح.";
  if (/code used/.test(m)) return "كود الرخصة ده اتفعّل قبل كده.";
  if (/last admin/.test(m)) return "لازم يفضل أدمن واحد على الأقل.";
  if (/account limit/.test(m)) return "وصلت لأقصى عدد حسابات في الرخصة. كلّم المطوّر.";
  if (/weak password|Password should be/i.test(m)) return pwShort()+".";
  if (/rate limit|too many/i.test(m)) return "محاولات كتير ورا بعض. استنى شوية وجرّب تاني.";
  if (/email.*invalid|invalid.*email/i.test(m)) return "السيرفر رفض إنشاء الحساب (إعداد الإيميل). كلّم المطوّر على "+DEV.phone+".";
  if ((e && (e.status === 401 || e.status === 403 || e.code === "42501")) || /not allowed|row-level security|JWT/i.test(m)) return "مش مسموحلك تعمل ده.";

/* account operations on the server */
const accTry = async (fn) => { try { await fn(); return true; } catch(e){ toast(cloudMsg(e)); return false; } };
createAccount = async (name, role, pw) => {
  if (!S.church || !S.church.live){ toast(cloudMsg("licence expired")); return false; }
  return accTry(async () => {
    const uid = await Cloud.signUp(await mailFor(S.church.slug, name), pw);
    if (!uid) throw new Error("signup failed");
    await Cloud.rpc("add_account", {p_uid:uid, p_name:name, p_role:role});
    Cloud.refresh("accounts/x");
  });
};
saveAccount = async (acc, patch) => {
  const p = {}; for (const k of ["role","active","photo"]) if (k in patch) p[k] = patch[k];
  const okk = await accTry(() => Cloud.rpc("update_account", {p_uid:acc.id, p_patch:p}));
  Cloud.refresh("accounts/x"); if (!okk) throw new Error("not saved");
};
deleteAccount = async (acc) => { const okk = await accTry(() => Cloud.rpc("delete_account", {p_uid:acc.id})); Cloud.refresh("accounts/x"); Cloud.refresh("pwreq/x"); if (!okk) throw new Error("not deleted"); };
reviewAccount = async (id, okk) => { const done = await accTry(() => Cloud.rpc("review_account", {p_uid:id, p_ok:okk}));
  Cloud.refresh("pending/x"); Cloud.refresh("accounts/x"); Cloud.refresh("members/x"); return done; };

function watchApproval(){
  clearInterval(watchApproval.t);

  watchApproval.t = setInterval(async () => {
    if (document.hidden || !Cloud.sess) return;
    try { const me = await Cloud.rpc("me");
      if (!me || me.role === "pending") return;
      clearInterval(watchApproval.t); Cloud.me = me;
      if (!me.active){ logout(); return; }
      applyAccount(cloudAccount(me)); subscribe(); render(); toast("🎉 حسابك اتوافق عليه، والبرنامج كله فتحلك");
    } catch(e){ if (e.status === 401 || /no account/.test(e.message||"")) { clearInterval(watchApproval.t); logout(); } }
  }, 20000);

dismissPwreq = async (id) => { await accTry(() => Cloud.rpc("dismiss_pwreq", {p_uid:id})); Cloud.refresh("pwreq/x"); };
setPassword = async (acc, pw, why) => {
  const okk = await accTry(() => Cloud.rpc("set_password", {p_uid:acc.id, p_pw:pw}));
  Cloud.refresh("accounts/x"); Cloud.refresh("pwreq/x");

  try { await Cloud.signIn(await mailFor(S.church.slug, S.account.name), oldPw); } catch(e){ if (e.offline) toast(cloudMsg(e)); return false; }

listAccounts = async () => { try { return await Cloud.list("accounts"); } catch(e){ return []; } };

function cloudAccount(me){
  S.church = {id:me.church_id, name:me.church, slug:me.slug, priest:me.priest, expires_at:me.expires_at, live:me.live};
  try { localStorage.setItem(CHURCH_KEY, me.slug); } catch(e){}

async function restoreCloudSession(){

  Cloud.sess = s;
  try { const me = await Cloud.rpc("me"); if (!me || !me.active || me.must_change) throw new Error("x");
    Cloud.me = me; applyAccount(cloudAccount(me)); watchApproval(); return true; }
  catch(e){ Cloud.setSess(null); return false; }

    }
    const b = Bio.get();
    if (mode !== "bio" && (!b || b.uid !== me.uid) && !localStorage.getItem("ruhiya_bio_skip_"+me.uid) && await Bio.can()){ mode = "bio"; draw(); return; }
    ssSet(okKey(), me.uid); unlock(); watchApproval();
  };
  const enter = async (me) => {
    Cloud.me = me; applyAccount(cloudAccount(me)); await logAct("دخل البرنامج");
    if (me.must_change){ mode = "change"; draw(); return; }
    await finish();
  };
  const draw = () => {
    const err = h("p",{class:"gate-err", role:"alert"});
    const busy = async (form, fn) => { const b = form.querySelector("button[type=submit]"); if (b) b.disabled = true; err.textContent = "";
      try { await fn(); } catch(e){ err.textContent = e && e.ui ? e.message : cloudMsg(e); } finally { if (b && b.isConnected) b.disabled = false; } };
    const fail = m => { const e = new Error(m); e.ui = true; throw e; };
    let sub = "", form, extra = [];
    const title = info && info.name ? info.name : ((S.settings && S.settings.title) || "المتابعة الروحية");
    if (mode === "church"){
      sub = "اكتب كود الكنيسة اللي أخدته من الأدمن.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const s = v("gChurch").trim().toLowerCase(); if (!slugOk(s)) fail("كود الكنيسة حروف إنجليزي صغيرة وأرقام وشَرطة، زي mar-mina.");
        slug = s; await loadInfo(); if (!info) { slug = ""; fail("مفيش كنيسة بالكود ده."); } if (info.error) fail(info.error);
        mode = "login"; draw(); }); }},
        h("label",null,"كود الكنيسة", h("input",{id:"gChurch", dir:"ltr", autocomplete:"organization", placeholder:"mar-mina", value:slug||""})),
        err, btn("متابعة"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ mode = "activate"; draw(); }},"🔑 تفعيل كنيسة جديدة بكود رخصة")];
    } else if (mode === "login"){
      sub = info && info.priest ? info.priest : "أهلاً بيك. ادخل باسمك وكلمة السر.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const w = lockWait(); if (w) fail(waitMsg(w));
        const name = v("gName").trim(), pw = v("gPw"); if (!name || !pw) fail("اكتب الاسم وكلمة السر.");
        try { await Cloud.signIn(await mailFor(slug, name), pw); }
        catch(e){ if (!e.offline) lockFail(); if ($("#gPw")) $("#gPw").value = ""; throw e; }
        lockOk();
        let me; try { me = await Cloud.rpc("touch_login"); } catch(e){ await Cloud.signOut(); fail(/no account/.test(e.message) ? "الاسم ده مش متسجّل في الكنيسة دي. لو أول مرة تدخل، دوس «حساب جديد» تحت." : cloudMsg(e)); }
        if (!me.active){ await Cloud.signOut(); fail("الحساب ده متوقف. كلّم الأدمن."); }
        await enter(me); }); }},
        info && info.live === false ? h("p",{class:"gate-err"},"رخصة الكنيسة خلصت، والبرنامج للقراءة بس لحد ما تتجدد.") : null,
        h("label",null,"الاسم", h("input",{id:"gName", autocomplete:"username", placeholder:"اكتب اسمك"})),
        h("label",null,"كلمة السر", pwInput("gPw","كلمة السر","current-password")),
        err, btn("دخول"));
      extra = [];
      const bio = Bio.get();
      if (bio && bio.slug === slug && window.PublicKeyCredential) extra.push(h("button",{class:"btn bio-btn", type:"button", style:"width:100%;padding-block:12px", onclick:async e => {
        const b = e.currentTarget; b.disabled = true; err.textContent = "";
        try {
          let ok = false; try { ok = await Bio.check(bio); } catch(x){ if (x && x.name === "NotAllowedError") { err.textContent = "البصمة اتلغت أو مااتعرفتش. جرّب تاني، أو ادخل بكلمة السر."; return; } throw x; }
          if (!ok) { err.textContent = "الموبايل ماأكدش البصمة. ادخل بكلمة السر."; return; }
          Cloud.sess = {access_token:"", refresh_token:bio.refresh, expires_at:0, uid:bio.uid};
          try { await Cloud.token(); } catch(x){ if (x.offline) throw x; Bio.put(null); Cloud.setSess(null); err.textContent = "الدخول بالبصمة وقف (اتغيّرت كلمة السر أو بقالك كتير مادخلتش). ادخل بكلمة السر وفعّلها تاني."; return; }
          if (!Cloud.sess){ Bio.put(null); err.textContent = "ادخل بكلمة السر وفعّل البصمة تاني."; return; }
          const me = await Cloud.rpc("touch_login");
          if (!me.active){ await Cloud.signOut(); Bio.put(null); err.textContent = "الحساب ده متوقف. كلّم الأدمن."; return; }
          await enter(me);
        } catch(x){ err.textContent = cloudMsg(x); } finally { if (b.isConnected) b.disabled = false; }
      }}, "👆 ادخل بالبصمة أو الوش · "+bio.name));
      extra = [...extra, info && info.claimed !== false ? h("button",{class:"btn ghost", type:"button", style:"width:100%", onclick:()=>{ mode = "register"; draw(); }},"🆕 أول مرة؟ اعمل حساب جديد") : null,
        h("button",{class:"linkish", type:"button", onclick:()=>{ mode = "forgot"; draw(); }},"نسيت كلمة السر؟"),
        h("button",{class:"linkish", type:"button", onclick:()=>{ mode = "church"; draw(); }},"مش دي كنيستك؟ غيّر الكود")];
    } else if (mode === "register"){
      sub = "اختار اسم وكلمة سر هتدخل بيهم على طول. بعد كده هتكتب بياناتك، وأبونا أو المشرف يوافق على حسابك.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const name = v("gName").trim().replace(/\s+/g, " "), pw = v("gPw");
        if (name.length < 2) fail("اكتب اسمك (الاسم الأول واسم الأب مثلاً)."); if (name.length > 60) fail("الاسم طويل أوي.");
        if (pw.length < PW_MIN) fail(pwShort()+"."); if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        if (info && info.live === false) fail("رخصة الكنيسة خلصت، ومينفعش تسجيل جديد دلوقتي.");
        const email = await mailFor(slug, name);
        try { await Cloud.signUp(email, pw); } catch(e){ if (!/already|exists/i.test(e.message)) throw e; }
        try { await Cloud.signIn(email, pw); } catch(e){ if (e.offline) throw e; fail("الاسم ده متسجّل قبل كده. لو ده إنت، ارجع وادخل بكلمة السر بتاعتك. لو لأ، زوّد اسم العيلة."); }
        let me; try { me = await Cloud.rpc("touch_login"); } catch(e){
          if (!/no account/.test(e.message)){ await Cloud.signOut(); throw e; }
          try { await Cloud.rpc("register_self", {p_slug:slug, p_name:name}); } catch(e2){ await Cloud.signOut(); throw e2; }
          me = await Cloud.rpc("touch_login");
          Cloud.me = me; applyAccount(cloudAccount(me)); await logAct("سجّل حساب جديد ومستني الموافقة"); }
        if (!me.active){ await Cloud.signOut(); fail("الحساب ده متوقف. كلّم الأدمن."); }
        await enter(me); }); }},
        h("label",null,"اسمك", h("input",{id:"gName", autocomplete:"username", placeholder:"الاسم الأول واسم الأب"})),
        h("label",null,"كلمة السر", pwInput("gPw","كلمة السر","new-password")),
        h("label",null,"اكتب كلمة السر تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        h("p",{class:"small muted", style:"margin:0"},"افتكر الاسم ده بالظبط، لأنك هتدخل بيه كل مرة."),
        err, btn("اعمل الحساب وادخل"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ mode = "login"; draw(); }},"عندي حساب، رجوع للدخول")];
    } else if (mode === "forgot"){
      sub = "اكتب اسمك، وهيوصل طلب للأدمن يعملك كلمة سر جديدة.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const name = v("gName").trim(); if (!name) fail("اكتب اسمك.");
        await Cloud.rpc("request_password", {p_slug:slug, p_name:name});
        mode = "login"; draw(); toast("لو الاسم ده موجود، الطلب وصل للأدمن وهيبلّغك بكلمة السر الجديدة"); }); }},
        h("label",null,"اسمك في البرنامج", h("input",{id:"gName", autocomplete:"username", placeholder:"اكتب اسمك"})),
        err, btn("📨 ابعت طلب للأدمن"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ mode = "login"; draw(); }},"رجوع للدخول")];
    } else if (mode === "photo"){
      sub = "أهلاً "+S.account.name+". قبل ما تدخل، حط صورتك عشان أبونا والخدام يعرفوك.";
      const prev = h("div",{class:"gate-photo"}, newPhoto ? h("img",{src:newPhoto, alt:"صورتك"}) : h("span",null,"📷"));
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        if (!newPhoto) fail("اختار صورتك الأول.");
        await Cloud.rpc("update_account", {p_uid:Cloud.me.uid, p_patch:{photo:newPhoto}});
        if (["user","pending"].includes(Cloud.me.role)) { try { await Store.update("members/"+Cloud.me.uid, {photo:newPhoto, name:S.account.name}); } catch(x){} }
        S.account.photo = newPhoto; Cloud.me.photo = newPhoto; await logAct("حط صورته");
        await finish(); }); }},
        prev,
        h("div",{class:"row", style:"justify-content:center"}, ...photoPickerSized("gPhoto", newPhoto ? "🔄 غيّر الصورة" : "📷 اختار صورة أو صوّر", 320, d => { newPhoto = d; draw(); })),
        err, btn("احفظ الصورة وادخل", newPhoto ? {} : {disabled:true}));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ S.account = null; Cloud.signOut(); mode = "login"; draw(); }},"خروج")];
    } else if (mode === "bio"){
      sub = "تحب تدخل المرة الجاية بالبصمة أو بوشّك بدل كلمة السر؟";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        try { await Bio.enroll(slug, S.account.name, Cloud.me.uid, Cloud.sess.refresh_token); }
        catch(x){ fail(x && x.name === "NotAllowedError" ? "اتلغت. تقدر تفعّلها بعدين من هنا لما تدخل تاني." : "الموبايل ده مش بيدعم البصمة للمواقع."); }
        await logAct("فعّل الدخول بالبصمة"); toast("👆 البصمة اتفعّلت على الجهاز ده"); await finish(); }); }},
        h("div",{class:"bio-art", "aria-hidden":"true"},"👆"),
        h("p",{class:"small muted", style:"margin:0"},"البصمة أو الوش بيتأكد منهم الموبايل نفسه، ومش بيتبعتوا لأي حد. ده بيشتغل على الجهاز ده بس، ولو حد غيرك بيستخدم الموبايل ماتفعّلهاش."),
        err, btn("👆 فعّل البصمة"));
      extra = [h("button",{class:"linkish", type:"button", onclick:async()=>{ try { localStorage.setItem("ruhiya_bio_skip_"+Cloud.me.uid, "1"); } catch(x){} await finish(); }},"مش دلوقتي")];
    } else if (mode === "change"){
      sub = "أهلاً "+S.account.name+". كلمة السر دي اتعملتلك من حد تاني، فاختار كلمة سر خاصة بيك محدش يعرفها.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const pw = v("gPw"); if (pw.length < PW_MIN) fail(pwShort()+"."); if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        await Cloud.setOwnPassword(pw); await Cloud.rpc("password_changed");
        await logAct("اختار كلمة سر جديدة"); S.account.mustChange = false; Cloud.me.must_change = false;
        toast("كلمة السر اتغيّرت"); await finish(); }); }},
        h("label",null,"كلمة السر الجديدة", pwInput("gPw","كلمة السر الجديدة","new-password")),
        h("label",null,"اكتبها تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("احفظ وادخل"));
      extra = [h("button",{class:"linkish", type:"button", onclick:async()=>{ await Cloud.signOut(); S.account = null; mode = "login"; draw(); }},"رجوع")];
    } else if (mode === "activate" && !lic){
      sub = "اكتب كود الرخصة اللي أخدته من المطوّر.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        licCode = v("gLic").trim(); if (!licCode) fail("اكتب كود الرخصة.");
        const w = lockWait(); if (w) fail(waitMsg(w));
        lic = await Cloud.rpc("licence_info", {p_code:licCode});
        if (!lic){ lockFail(); fail("كود الرخصة غلط، أو اتفعّل قبل كده، أو خلص."); }
        lockOk(); draw(); }); }},
        h("label",null,"كود الرخصة", h("input",{id:"gLic", dir:"ltr", autocomplete:"off", placeholder:"RUH-XXXX-XXXX-XXXX"})),
        err, btn("تأكيد الكود"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ mode = slug ? "login" : "church"; draw(); }},"رجوع")];
    } else {
      sub = "الرخصة سليمة لـ «"+lic.name+"». اعمل حساب الأدمن، وبعد كده الأدمن يعمل حسابات أبونا والمشرفين والمستخدمين.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const name = v("gName").trim(), pw = v("gPw");
        if (!name || !pw) fail("اكتب الاسم وكلمة السر."); if (pw.length < PW_MIN) fail(pwShort()+"."); if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        const email = await mailFor(lic.slug, name);
        try { await Cloud.signUp(email, pw); } catch(e){ if (!/already|exists/i.test(e.message)) throw e; }
        await Cloud.signIn(email, pw);
        await Cloud.rpc("claim_church", {p_code:licCode, p_name:name});
        slug = lic.slug; const me = await Cloud.rpc("touch_login"); lic = null;
        await enter(me); toast("الكنيسة اتفعّلت. كود الكنيسة: "+me.slug); }); }},
        h("div",{class:"notice"}, h("span",null, "كود الكنيسة: ", h("b",{dir:"ltr"}, lic.slug), " · الرخصة لحد "+fmtShort(lic.expires_at))),
        h("label",null,"اسم الأدمن", h("input",{id:"gName", autocomplete:"username", placeholder:"اكتب اسمك"})),
        h("label",null,"كلمة السر", pwInput("gPw","كلمة السر","new-password")),
        h("label",null,"اكتب كلمة السر تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("تفعيل الكنيسة وإنشاء حساب الأدمن"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ lic = null; draw(); }},"رجوع")];
    }
    gate.replaceChildren(h("div",{class:"gate-card"}, churchMark(),
      h("div",null, h("h1",null,title), h("p",{class:"muted small"}, sub)),
      form, ...extra, h("p",{class:"small muted", style:"margin:0"},"🔒 بياناتك محفوظة على سيرفر الكنيسة، ومحدش بيشوفها غير اللي ليه صلاحية."), devBlock()));
    const f = gate.querySelector("input"); if (f) f.focus();
  };
  draw();
}

boot();
})();
</script>
<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
