/* Layout: a modern mobile app. A teal-to-blue gradient card opens the page, white rounded cards hold each screen,
   every section and tab carries its own coloured icon tile, and the nav is a bottom app bar on phones. */
:root{
  --a:#0f766e; --a2:#0e7490; --b:#1e40af; --h1:#14706a; --h2:#0d3b5c; --h3:#0a1f3d;
  --bg:#f6efe1; --surface:#fffdf8; --surface-2:#fbf5e9; --line:#ebe1cc;
  --ink:#172033; --ink-2:#5b6680; --on-a:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#e11d48;
  /* text-safe shades of ok/warn/gold (4.5:1 on light surfaces) */
  --ok-ink:#166534; --warn-ink:#92400e; --gold-ink:#8a6414;
  --shadow:0 1px 2px rgba(23,32,51,.05), 0 6px 20px rgba(23,32,51,.06);
  --f-head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-scripture:"Amiri","Noto Naskh Arabic",serif;
  --nav-h:68px; --r:20px;
  --brand-grad:linear-gradient(135deg,var(--a),var(--b));
  --gold:#c9a227; --gold-2:#e9c96b; --gold-d:#8a6414;
  --gold-grad:linear-gradient(180deg,#f2d06b,#d4a630 30%,#a8741a 55%,#d4a630 80%,#f2d06b);
  --gold-line:color-mix(in oklab,var(--gold) 45%,transparent);
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --ok-ink:#4ade80; --warn-ink:#fbbf24; --gold-ink:#e9c96b; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1730; --surface:#11244a; --surface-2:#162d58; --line:#24406e; --ink:#eef2fa; --ink-2:#a3b1cc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --ok-ink:#4ade80; --warn-ink:#fbbf24; --gold-ink:#e9c96b; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.22rem} h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.85}
/* iPhone Safari draws date / time boxes at their own width and ignores width:100%, so they stuck out of the card */
input,select,textarea{max-width:100%;box-sizing:border-box}
input[type=date],input[type=datetime-local],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:1.4}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:right;margin:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in oklab,var(--gold) 20%,transparent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:5px;font-size:.86rem;color:var(--ink-2);font-weight:600}
a{color:var(--a);font-weight:600}
.btn{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on-a);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700;white-space:nowrap;
  box-shadow:0 4px 14px color-mix(in oklab,var(--a) 30%,transparent)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:color-mix(in oklab,var(--a) 12%,var(--surface));color:var(--a);box-shadow:none}
.btn.quiet{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.btn.quiet.danger-text{color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
.btn[aria-busy="true"]{opacity:.8;cursor:progress}
.btn[aria-busy="true"]::before{content:"";display:inline-block;width:.95em;height:.95em;margin-inline-end:8px;vertical-align:-.12em;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:btn-spin .7s linear infinite}
@keyframes btn-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.btn[aria-busy="true"]::before{animation-duration:1.8s}}

/* colourful icon tiles */
.ico{--c:#64708a;display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:11px;
  background:color-mix(in oklab,var(--c) 15%,var(--surface));color:var(--c)}
.ico svg{width:20px;height:20px}
.ico.lg{width:44px;height:44px;border-radius:14px}.ico.lg svg{width:24px;height:24px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 30px color-mix(in oklab,var(--a) 30%,transparent);display:grid;gap:10px}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;inset-inline-end:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.cross{width:40px;height:40px;padding:7px;border-radius:12px;background:rgba(255,255,255,.2);color:#fff}
.brand{display:grid}
.brand .eyebrow{font-size:.8rem;opacity:.9;font-weight:600}
.brand h1{font-size:1.6rem;color:#fff}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.glass{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;color:#fff;display:inline-flex;gap:6px;align-items:center}
.coptic{font-family:var(--f-head);font-weight:800;font-size:1rem}
#gregDate{opacity:.95}
.season-chip i{width:8px;height:8px;border-radius:50%;background:#fff}
#feastLine{position:relative;z-index:1;font-weight:700}
#feastLine:empty{display:none}
#noticeSlot:empty{display:none}
.notice{color:var(--ink);margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.notice .btn{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.notice .btn.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px;background:var(--bg)}
nav.tabs .wrap{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
nav.tabs button{position:relative;border:0;background:var(--surface);box-shadow:var(--shadow);padding:5px 14px 5px 6px;border-radius:14px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;font-weight:700;font-family:var(--f-head)}
nav.tabs button .ico{width:30px;height:30px;border-radius:10px}
nav.tabs button .ico svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ico{background:var(--c);color:#fff}
nav.tabs .badge{min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;font-weight:700}
@media (max-width:720px), (orientation:landscape) and (max-height:520px){
  nav.tabs{position:fixed;inset:auto 0 0 0;top:auto;background:var(--surface);padding:6px max(6px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px));
    box-shadow:0 -4px 20px rgba(23,32,51,.08);border-top:1px solid var(--line)}
  #app{padding-top:14px}
  nav.tabs .wrap{flex-wrap:nowrap;justify-content:space-around;gap:0}
  nav.tabs button{flex:1;flex-direction:column;gap:2px;padding:2px;font-size:.7rem;box-shadow:none;background:transparent}
  nav.tabs .badge{position:absolute;top:-2px;inset-inline-start:calc(50% + 8px)}
}

main{display:grid;gap:18px}
section{display:grid;gap:10px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.sec-head h2{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.form > *{min-width:0}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:start;color:var(--ink);justify-items:start}
.stat b{font-family:var(--f-head);font-size:1.8rem;font-weight:800;line-height:1}
.stat span:last-child{font-size:.8rem;color:var(--ink-2);font-weight:600}
.stat.alert b{color:var(--bad)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}}

ul.list{list-style:none;margin:0;padding:4px 0;display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
ul.list li{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
ul.list li:first-child{border-top:0}
ul.list li.click{cursor:pointer}
ul.list li.click:hover{background:var(--surface-2)}
.who{display:grid;min-width:0}
.who strong{font-weight:700}
.pill{display:inline-block;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:600;line-height:24px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:color-mix(in oklab,var(--warn) 15%,var(--surface));color:var(--warn-ink)}
.pill.bad{background:color-mix(in oklab,var(--bad) 15%,var(--surface));color:var(--bad)}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,var(--surface));color:var(--ok-ink)}
.nid-pill{white-space:normal;line-height:1.45;padding-block:3px}
.nid-row{gap:6px}
.acc-row > .nid-row{grid-column:1/-1}
.nid-box{display:grid;gap:6px}
.nid-mask{direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px}
.nid-hint{margin:0;color:var(--ink-2)}
.nid-hint.ok{color:var(--ok-ink)}
.nid-hint.bad{color:var(--bad);font-weight:600}
.pill.acc{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center;font-weight:600}
.family-head{font-family:var(--f-head);font-weight:800;font-size:.95rem;color:var(--a)}

.reading{display:grid;gap:6px}
.reading .ref{display:inline-block;width:max-content;font-size:.76rem;font-weight:700;color:#0d9488;background:color-mix(in oklab,#14b8a6 14%,var(--surface));padding:0 10px;border-radius:999px}
.auto-read{display:grid;gap:10px}
.rsec{border:1px solid var(--gold-line);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.rsec>summary{cursor:pointer;list-style:none;font-weight:700}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary::before{content:"▸ ";color:#0d9488}
.rsec[open]>summary::before{content:"▾ "}
.rsub{margin:6px 0 0;font-size:.95rem;color:var(--a)}
.syn{font-family:var(--f-body)!important;font-size:1.02rem!important}
.reading .text{font-family:var(--f-scripture);font-size:1.18rem;line-height:2;white-space:pre-wrap;max-width:65ch}
.medit{display:grid;gap:6px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,color-mix(in oklab,#8b5cf6 10%,var(--surface)),color-mix(in oklab,#ec4899 8%,var(--surface)))}
.medit h3{color:#8b5cf6}
.medit .text{font-family:var(--f-scripture);font-size:1.22rem;line-height:2;white-space:pre-wrap;max-width:60ch}

.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:#22c55e;flex:none}
.check:has(input:checked){border-color:var(--gold);background:color-mix(in oklab,#22c55e 10%,var(--surface))}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.68rem;color:var(--ink-2);font-weight:600}
.day.l1{background:color-mix(in oklab,#22c55e 30%,var(--surface))}
.day.l2{background:color-mix(in oklab,#22c55e 62%,var(--surface));color:var(--ink)}
.day.l3{background:#15803d;color:#fff}
.detail{outline:0;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:20}
.sched-days{display:grid;gap:8px}
.sched-day{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sched-day.on{border-color:var(--gold)}
.sched-day .check{min-width:96px;font-weight:700}
.sched-dname{min-width:96px}
.sched-periods{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.sched-per{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 8px;border-radius:10px;border:1px dashed var(--line)}
.sched-per.on{border-style:solid;border-color:var(--gold-line);background:var(--surface)}
.sched-per .check{min-width:84px;font-weight:600}
.sched-range{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sched-range.on{border-color:var(--gold)}
.renew-card{border-color:var(--gold)!important;background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.sched-hours{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sched-hours input{max-width:120px}
.sched-card h4{margin:6px 0 0;font-size:.92rem}
.time-row{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.time-row .chip-btn{border-radius:12px;padding:10px 4px;font-weight:700}
.time-row .chip-btn[aria-pressed="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
.digit-pick{border-radius:12px;padding:8px 14px;font-weight:700}
.digit-pick[aria-pressed="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
.toast.idle-warn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(92vw,460px);text-align:center;line-height:1.5}
footer{margin-top:24px;font-size:.8rem;color:var(--ink-2);text-align:center}
@media (max-width:480px){.days{gap:2px}}

/* verse ticker + welcome (from the service program) */
.ticker{margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:center;min-height:46px;display:grid;place-items:center}
#verse{font-family:var(--f-scripture);font-size:1.08rem;font-weight:700;line-height:1.7;transition:opacity .45s}
.welcome{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;position:relative;z-index:1;font-weight:700}
#liveClock{font-size:.84rem;opacity:.95;font-variant-numeric:tabular-nums}
.hero-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
body.locked .ticker{display:none}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.filters .chip-btn{padding:6px 12px;font-size:.88rem}
.chips.filters .chip-btn b{background:var(--line);border-radius:999px;padding:0 7px;margin-inline-start:2px}
.chips.filters .chip-btn[aria-pressed="true"] b{background:color-mix(in oklab,var(--a) 22%,var(--surface))}
ul.list li > .person-line{flex:1 1 240px}
.contact{display:inline-flex;gap:6px;margin-inline-start:auto}
.ic-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:1.05rem;border:1.5px solid var(--line);background:var(--surface)}
.ic-btn.call{border-color:#93c5fd;background:color-mix(in oklab,#3b82f6 14%,var(--surface))}
.ic-btn.wa{border-color:#86efac;background:color-mix(in oklab,#22c55e 14%,var(--surface))}
.family-head.letter-head{font-size:1.15rem}
.wa-after{border:2px solid #86efac;display:grid;gap:10px}
a.btn{text-decoration:none}
.occ{position:relative;overflow:hidden;border-radius:22px;background:#14234f;box-shadow:0 10px 26px rgba(6,24,48,.3);color:#fff;isolation:isolate}
.occ canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* photo designs (2026-11-09): the photo moves very slowly (a gentle zoom), framed in gold like the others */
.occ-photo{position:absolute;inset:0;background:center 38%/cover no-repeat;z-index:0;transform-origin:50% 40%}
.occ[data-occ="church"] canvas{z-index:1}
.occ[data-occ="church"] .occ-photo{background-position:center 56%;transform-origin:52% 58%;transform:scale(1.55);animation:occZoomK 38s ease-in-out infinite alternate}
.occ-opt .occ[data-occ="church"] .occ-photo{transform:scale(1.35)}

.ei{--c:#0f766e;display:inline-grid;place-items:center;flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--c);color:#fff;
  vertical-align:-.42em;margin-inline-end:.2em;box-shadow:0 2px 5px color-mix(in oklab,var(--c) 35%,transparent)}
.ei svg{width:62%;height:62%}
.prep-emo .ei,.father-ic .ei{width:100%;height:100%;margin:0;vertical-align:0}
.prep-emo:has(.ei){background:none;border:0;font-size:inherit}
.ic-btn{border:0!important;background:none!important;width:auto;height:auto}.ic-btn .ei{width:38px;height:38px;margin:0;vertical-align:0}
.btn .ei{width:1.45em;height:1.45em;vertical-align:-.4em}
.prep-list .emo .ei{width:30px;height:30px;vertical-align:-.3em}
.pw button.eye .ei{width:30px;height:30px;margin:0}
.ico .emo{font-family:var(--f-emoji);font-size:20px;line-height:1}
.ico.lg .emo{font-size:25px}
nav.tabs button .ico .emo{font-size:17px}
nav.tabs button[aria-current="page"] .ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
nav.tabs button:not([aria-current="page"]) .ico{opacity:.82}
nav.tabs button[aria-current="page"]{color:var(--gold-d)}
.btn{background:linear-gradient(135deg,var(--a),var(--a2) 60%,var(--b))}
.btn.gold{background:var(--gold-grad);color:#3b2a05}
.avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.gate-church{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold),var(--shadow)}
.rsec>summary::before,.reading .ref{color:var(--gold-d)}
.reading .ref{background:color-mix(in oklab,var(--gold) 14%,var(--surface))}
.rsub{color:#0e7490}
.stat:hover,ul.list li.click:hover{background:color-mix(in oklab,var(--gold) 6%,var(--surface))}
.emoji-h{font-family:var(--f-emoji)}
.pw button.eye{font-family:var(--f-emoji);font-size:1.2rem;line-height:1;padding:4px 6px}
.gate-cross{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold),0 10px 24px rgba(14,60,110,.25)}
.notice .btn.on{background:var(--brand-grad)}

/* confession preparation */
.prep{gap:12px}
.prep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.prep>summary::-webkit-details-marker{display:none}
.prep>summary::after{content:"▾";margin-inline-start:auto;color:var(--gold-d);transition:transform .2s}
.prep:not([open])>summary::after{transform:rotate(90deg)}
.prep-emo{font-family:var(--f-emoji);font-size:24px;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;flex:none;
  background:color-mix(in oklab,var(--gold) 14%,var(--surface));border:1px solid var(--gold-line)}
.prep-t{display:grid}
.prep-t strong{font-family:var(--f-head);font-size:1.02rem}
.prep-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prep-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);line-height:1.8}
.prep-list .emo{font-family:var(--f-emoji);font-size:18px;line-height:1.6;flex:none}
.prayer{font-family:var(--f-scripture);font-size:1.2rem;line-height:2.1;white-space:pre-wrap;max-width:62ch;padding:14px 16px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in oklab,var(--gold) 8%,var(--surface)),var(--surface));border-inline-start:3px solid var(--gold)}

/* accounts & admin */
.acc-row{display:grid!important;grid-template-columns:1fr auto;gap:8px 10px}
ul.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;border:0;background:none;box-shadow:none;padding:0}
ul.acc-grid li.acc-row{border:1px solid var(--gold-line);border-radius:16px;background:var(--surface);padding:12px;align-content:start}
ul.acc-grid li.acc-row.open{grid-column:1/-1}
/* cards (2026-11-05 fix): one column inside each card, so the name, the pills and the buttons each get the full width */
ul.acc-grid li.acc-row{grid-template-columns:minmax(0,1fr)!important;gap:8px}
ul.acc-grid li.acc-row > *{min-width:0}
ul.acc-grid li.acc-row .person-line .who strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
ul.acc-grid li.acc-row > .row{flex-wrap:wrap;justify-content:flex-start;gap:6px}
ul.acc-grid li.acc-row .acc-contact{display:flex;gap:8px;flex-wrap:wrap}
ul.father-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;border:0!important;background:none!important;box-shadow:none!important;padding:0!important}
ul.father-grid li.father-card{display:flex;gap:10px;align-items:center;border:1px solid var(--gold-line);border-radius:16px;background:var(--surface);padding:10px 12px;cursor:pointer}
ul.father-grid li.father-card.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-line) inset}
/* admin screen (2026-11-07): father tiles, a sticky bar of its parts, a compact codes card, titles over their hint, loading shimmer */
.fathers-strip ul.father-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:560px){.fathers-strip ul.father-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fathers-strip ul.father-grid li.father-card{flex-direction:column!important;align-items:center;text-align:center;gap:6px;padding:14px 10px 12px;border-radius:20px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:0 2px 10px rgba(15,23,42,.06);transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.fathers-strip ul.father-grid li.father-card:hover{box-shadow:0 6px 18px rgba(15,23,42,.1)}
.fathers-strip ul.father-grid li.father-card:active{transform:scale(.97)}
.fathers-strip ul.father-grid li.father-card.on{background:linear-gradient(160deg,rgba(15,118,110,.12),rgba(37,99,235,.12));border-color:var(--gold)}
.ft-ph{position:relative;display:inline-block}
.ft-ph .avatar{width:68px!important;height:68px!important;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #d4a630;font-size:1.6rem}
.ft-none{display:grid;place-items:center;background:var(--surface-2)!important}
.ft-wait{position:absolute;bottom:-4px;inset-inline-start:-8px;background:#f59e0b;color:#fff;border-radius:999px;padding:1px 7px;font-size:.72rem;font-weight:800;box-shadow:0 0 0 2px var(--surface)}
.ft-name{font-family:var(--f-head);font-size:.98rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fathers-strip .father-n{display:inline-block;padding:2px 10px;border-radius:999px;background:linear-gradient(180deg,#f2d06b,#d4a630);color:#3b2a05;font-weight:800;font-size:.82rem}
.ft-bar{display:block;width:80%;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.ft-bar i{display:block;height:100%;background:linear-gradient(90deg,#0f766e,#2563eb);border-radius:4px}
.adm-nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 6px;margin:0 -6px;border-radius:16px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(15,23,42,.08)}
.adm-nav::-webkit-scrollbar{display:none}
.adm-nav-b{flex:1 1 0;min-width:max-content;border:1px solid var(--gold-line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s,color .15s,transform .12s}
.adm-nav-b:active{transform:scale(.95)}
.adm-nav-b[aria-current="true"]{background:var(--brand-grad);color:#fff;border-color:var(--gold)}
.adm-tools{display:grid;gap:18px}
.pp-admin:not(.open) .pp-head{align-items:center}
.pp-head .who{gap:2px}
#app .fathers-strip .sec-head,#admPeople .sec-head{flex-direction:column;align-items:flex-start;gap:2px}
.skel{position:relative;overflow:hidden;min-height:84px;background:var(--surface-2)!important;border-color:var(--line)!important}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:skel 1.2s infinite}
li.father-card.skel{min-height:150px}
@keyframes skel{to{transform:translateX(100%)}}
.db-card.warn{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 10%,var(--surface))}
.db-card.ok{padding-block:12px}
.db-card.ok .db-bar i{background:linear-gradient(90deg,#0f766e,#2563eb)}
.online-card h3{display:flex;align-items:center;gap:6px}
.on-dot{width:10px;height:10px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:onpulse 1.8s infinite}
@keyframes onpulse{70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.on-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.on-item{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--gold-line);border-radius:999px;background:var(--surface);cursor:pointer}
.on-item:active{transform:scale(.97)}
.on-ph{position:relative;display:inline-flex}
.on-ph .avatar{width:34px!important;height:34px!important;min-width:34px}
.on-badge{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 2px var(--surface)}
.on-who{display:flex;flex-direction:column;line-height:1.2}
.on-who strong{font-size:.92rem}
li.dir-row .seen{display:block;font-size:.75rem;color:var(--ink-3,#64748b)}
li.dir-row .seen.on{color:#16a34a;font-weight:700}
li.dir-row .seen.on::before{content:"● "}
@media (prefers-reduced-motion:reduce){.on-dot{animation:none}}
.db-card.full{border-color:#dc2626!important;background:color-mix(in srgb,#dc2626 10%,var(--surface))}
.db-bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.db-bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#dc2626)}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}.fathers-strip ul.father-grid li.father-card{transition:none}}
.father-n{font-weight:700;color:var(--brand)}
.father-w{color:var(--warn,#d97706);font-weight:600}
ul.acc-grid li.acc-row[hidden]{display:none!important}
.acc-group-h{margin:0 0 8px}
.acc-filter{gap:6px;flex-wrap:wrap}
.contact-box{display:grid;gap:6px}
.wa-tpls{flex-wrap:wrap}
.acc-tools{grid-column:1/-1;display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--gold-line)}
.pw-shown{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box}
.pw-big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.8rem;font-weight:800;letter-spacing:.18em;text-align:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.stat .prep-emo{width:38px;height:38px;font-size:20px;border-radius:12px}
.or{text-align:center;color:var(--ink-2);font-weight:700;font-size:.85rem}

/* header: saint image + signed-in person */
.hero{grid-template-columns:1fr auto;align-items:start;column-gap:14px}
.hero-main{display:grid;gap:10px;min-width:0;position:relative;z-index:1}
.hero-side{display:grid;gap:10px;justify-items:center;position:relative;z-index:1}
.me-box{display:flex;align-items:center;gap:6px}
.me-box .logout{margin:0}
#meAvatar .avatar{width:38px;height:38px;font-size:.95rem;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 3.5px var(--gold)}
.saint{margin:0;width:104px;aspect-ratio:3/4;border-radius:52px 52px 16px 16px;padding:3px;background:var(--gold-grad);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.saint img{width:100%;height:100%;object-fit:cover;border-radius:49px 49px 13px 13px;display:block;background:#0b2f4f}
@media (max-width:420px){.saint{width:88px}}

/* clock chip + every round picture fits its circle with a gold rim */
.clock-chip{font-family:var(--f-head);font-size:1.35rem;font-weight:800;padding:4px 16px;letter-spacing:.02em}
img.avatar, .hero-logo, .dev-logo, .gate-church, .gate-logo, #meAvatar img{
  aspect-ratio:1/1;object-fit:cover;object-position:center 30%;border-radius:50%;flex:none;display:block;
  padding:2.5px;background:var(--gold-grad);box-shadow:0 2px 8px rgba(0,0,0,.18)}
img.avatar{height:auto}
.avatar:not(img){aspect-ratio:1/1;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
#meAvatar img.avatar{width:42px;height:42px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gate-church{padding:4px}

/* developer signature */
.dev{display:grid;gap:10px;justify-items:center;border-top:0!important;padding-top:6px!important}
.dev-rule{display:flex;align-items:center;gap:10px;width:min(260px,80%);color:var(--gold-ink);font-size:.8rem}
.dev-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.dev-rule i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.dev-card{display:flex;align-items:center;gap:14px;padding:10px 18px 10px 12px;border-radius:999px;max-width:100%;
  border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box;
  box-shadow:0 6px 18px rgba(120,80,10,.12)}
.dev-logo{width:58px!important;height:58px!important;padding:3px!important}
.dev-text{display:grid;gap:1px;text-align:start;min-width:0}
.dev-label{font-size:.72rem;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.dev-text strong{font-size:1.02rem!important;line-height:1.35;white-space:nowrap}
.dev-phone{display:inline-flex;align-items:center;gap:6px;width:max-content;margin-top:3px;padding:1px 12px;border-radius:999px;font-weight:700;font-size:.85rem;
  color:var(--gold-d);text-decoration:none;border:1px solid var(--gold-line);background:color-mix(in oklab,var(--gold) 10%,var(--surface));font-variant-numeric:tabular-nums}
.dev-phone .emo{font-family:var(--f-emoji);font-size:.9rem}
:root[data-theme="dark"] .dev-phone{color:var(--gold-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dev-phone{color:var(--gold-2)}}
@media (max-width:360px){.dev-text strong{font-size:.9rem!important}.dev-logo{width:48px!important;height:48px!important}}
footer{margin-top:28px}

.danger-card{border-color:color-mix(in oklab,var(--bad) 45%,transparent)!important}
.reset-warn{display:grid;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in oklab,var(--bad) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--bad) 35%,transparent)}
.btn.danger{background:linear-gradient(135deg,#e11d48,#9f1239);box-shadow:0 4px 14px rgba(225,29,72,.3)}

/* every section in a gold frame */
.card, ul.list, .stat, .ticker, .notice, .rsec{border:1.5px solid transparent!important;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gold-grad) border-box!important}
/* card grids: each card has its own gold frame, the list around them has none */
ul.list.acc-grid, ul.list.father-grid{border:0!important;background:none!important;box-shadow:none!important;padding:0!important}
/* «النوتة الروحية» month (2026-11-06) */
.nbm{display:grid;gap:8px}
.nbm-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nbm-head .btn{min-width:40px;font-size:1.2rem;font-weight:800}
.nbm-title{font-size:1.05rem}
.nbm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.nbm-wd{font-size:.7rem;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbm-day{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;border:1px solid var(--gold-line);background:var(--surface);font-weight:700;font-size:.9rem}
.nbm-day.l1{background:color-mix(in oklab,var(--brand) 22%,var(--surface))}
.nbm-day.l2{background:color-mix(in oklab,var(--brand) 50%,var(--surface));color:#fff}
.nbm-day.l3{background:var(--brand);color:#fff}
.nbm-day.today{outline:2px solid var(--gold);outline-offset:1px}
.nbm-day.on{box-shadow:0 0 0 3px var(--gold)}
.nbm-day:disabled{opacity:.35;cursor:default}
.nbm-day:focus-visible{outline:3px solid var(--gold)}
/* «دليل الأسماء» (2026-11-05): A-to-Z list + letter rail; the chosen card beside it (computer) or as a bottom sheet (phone) */
.dir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.dir-main{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px;align-items:start}
.dir-list{display:grid;gap:10px;min-width:0}
.dir-letter{position:sticky;top:0;z-index:2;margin:0;padding:4px 12px;font-size:1.05rem;font-weight:800;color:var(--gold);background:var(--bg,var(--surface));border-bottom:1.5px solid var(--gold-line)}
ul.list.dir-ul{border:0!important;background:none!important;box-shadow:none!important;padding:0!important;display:grid;gap:4px}
ul.list.dir-ul li.dir-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:12px;background:var(--surface);cursor:pointer;justify-content:flex-start;flex-wrap:nowrap}
ul.list.dir-ul li.dir-row:hover{border-color:var(--gold-line)}
ul.list.dir-ul li.dir-row.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 12%,var(--surface))}
li.dir-row[hidden]{display:none!important}
ul.list.dir-ul li.dir-row{padding:6px 10px!important;min-height:0!important;margin:0!important;box-shadow:none!important}
ul.list.dir-ul li.dir-row .avatar{width:40px!important;height:40px!important;min-width:40px;font-size:1.05rem!important;border-width:2px!important}
.dir-sec{display:grid;gap:4px}
ul.list.dir-ul li.dir-row .who strong{font-size:1rem}
li.dir-row .who{min-width:0;flex:1}
li.dir-row .who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.dir-row .who .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-marks{display:flex;gap:4px;flex:none}
.dir-mark{font-size:.95rem}
.dir-rail{position:sticky;top:70px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:999px;background:var(--surface);border:1px solid var(--gold-line);max-height:calc(100vh - 90px);overflow-y:auto}
.dir-rail button{all:unset;cursor:pointer;width:26px;height:24px;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:.82rem;color:var(--brand)}
.dir-rail button:hover,.dir-rail button:focus-visible{background:var(--gold);color:#fff}
.dir-rail button:disabled{opacity:.25;cursor:default;background:none;color:inherit}
.dir-pane{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto}
.dir-pane-in{position:relative}
.dir-close{position:absolute;top:8px;left:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-line);background:var(--surface);cursor:pointer;font-size:1rem}
ul.list.acc-grid.dir-card{display:block}
.dir-empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:40px 16px;border:1.5px dashed var(--gold-line);border-radius:18px;color:var(--muted)}
.dir-empty p{margin:0}
.dir-backdrop{display:none}
@media (max-width:899px){
  .dir{grid-template-columns:minmax(0,1fr)}
  .dir-pane{position:static;max-height:none}
  .dir:not(.has-sel) .dir-pane{display:none}
  .dir.has-sel .dir-pane{position:fixed;inset:auto 0 0 0;z-index:60;max-height:86vh;overflow-y:auto;background:var(--bg,var(--surface));border-radius:22px 22px 0 0;border-top:3px solid var(--gold);padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  .dir.has-sel .dir-pane::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--gold-line);margin:0 auto 10px}
  .dir.has-sel .dir-backdrop{display:block;position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.45)}
  .dir-close{top:0}
}
.empty{border:1.5px dashed var(--gold)!important;background:color-mix(in oklab,var(--gold) 4%,var(--surface))}
.prep-list li, .acc-tools, .reset-warn{border-color:var(--gold-line)!important}
ul.list li{border-top-color:var(--gold-line)!important}

/* header frame = signed-in person's photo */
.saint{position:relative}

function households(all){
  const parent = new Map(all.map(p => [p.id, p.id]));
  const find = x => parent.get(x) === x ? x : (parent.set(x, find(parent.get(x))), parent.get(x));
  const join = (a,b) => parent.set(find(a), find(b));
  const byFam = new Map();
  for (const p of all) if (p.familyName){ if (byFam.has(p.familyName)) join(p.id, byFam.get(p.familyName)); else byFam.set(p.familyName, p.id); }
  for (const a of all) for (const b of all) if (a.id < b.id && a.spouse && b.spouse && firstName(a.spouse) === firstName(b.name) && firstName(b.spouse) === firstName(a.name)) join(a.id, b.id);
  const groups = new Map();
  for (const p of all){ const k = find(p.id); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
  return [...groups.values()].filter(g => g.length > 1 || g[0].spouse || (g[0].children||[]).length || g[0].familyName);
}

const phoneKey = s => { const d = nidDigits(s); return d.length >= 8 ? d.slice(-10) : ""; };

function famReasons(a, b){
  const out = [], fa = firstName(b.name), pa = phoneKey(a.phone), pb = phoneKey(b.phone);
  if (pa && pa === phoneKey(b.spousePhone)) out.push("رقم تليفونه هو رقم شريك حياة "+fa);
  if (pb && pb === phoneKey(a.spousePhone)) out.push("رقم شريك حياته هو رقم "+fa);
  for (const c of b.children||[]) if (pa && pa === phoneKey(c.phone)) out.push("رقم تليفونه مكتوب لابن "+fa+" ("+c.name+")");
  for (const c of a.children||[]) if (pb && pb === phoneKey(c.phone)) out.push("رقم "+fa+" مكتوب عنده لابنه "+c.name);
  const sp = (x, y) => x.spouse && firstName(x.spouse) && arKey(firstName(x.spouse)) === arKey(firstName(y.name));
  if (sp(a, b) && sp(b, a)) out.push("كاتب "+fa+" شريك حياته، و"+fa+" كاتبه هو كمان");
  else if (a.spouse && arKey(a.spouse).split(" ").length >= 2 && arKey(a.spouse) === arKey(b.name)) out.push("كاتب اسم "+b.name+" بالكامل كشريك حياة");
  else if (b.spouse && arKey(b.spouse).split(" ").length >= 2 && arKey(b.spouse) === arKey(a.name)) out.push(fa+" كاتب اسمه بالكامل كشريك حياة");
  const kid = (x, y) => (y.children||[]).find(c => c.birthday && c.birthday === x.birthday && arKey(firstName(c.name)) === arKey(firstName(x.name)));
  let k = kid(a, b); if (k) out.push("اسمه وتاريخ ميلاده زي "+k.name+" ابن "+fa);

  return [...new Set(out)];
}
// pairs the father hasn't answered yet; a = the one who joined the app (or the newer entry), b = the one already on his list
function famSuggestions(all){
  const fam = new Map(); households(all).forEach((g, i) => g.forEach(p => fam.set(p.id, i)));
  const no = p => (p.pr && p.pr.famNo) || [];
  const out = [];
  for (const a of all) for (const b of all){
    if (a.id === b.id || !a.onApp || (b.onApp && a.id > b.id)) continue;
    if (fam.has(a.id) && fam.get(a.id) === fam.get(b.id)) continue;
    if (a.familyName && a.familyName === b.familyName) continue;
    if (no(a).includes(b.id) || no(b).includes(a.id)) continue;
    const why = famReasons(a, b); if (why.length) out.push({a, b, why});
  }
  // أبونا's own wife and children among his confessees: they go to «أسرة الأب الكاهن» (nothing is written about أبونا himself)
  const me = famSelf();
  if (me) for (const a of all){
    if (a.id === me.id || a.familyName === FATHER_FAM || no(a).includes(me.id)) continue;
    const fn = firstName(me.name), why = famReasons(a, me).map(w => fn ? w.split(fn).join("أبونا") : w);
    if (why.length) out.push({a, b:me, why, self:true});
  }
  return out;
}

async function famAnswer(s, join){

    toast("✅ "+a.name+" اتضم لـ «"+FATHER_FAM+"»");
  } else if (join){
    const name = b.familyName || a.familyName || "عائلة "+firstName(b.name)+" و"+firstName(a.name);
    for (const p of [a, b]) await editDoc(PP()+"/"+p.id, cur => Object.assign(cur, {onApp:!!p.onApp, familyName:name}));
    toast("✅ "+a.name+" اتضم لـ «"+name+"»");

    await editDoc(PP()+"/"+a.id, cur => Object.assign(cur, {onApp:!!a.onApp, famNo:[...new Set([...(cur.famNo||[]), b.id])]}));

}

  months.forEach((b,i)=>{
    const x = W-pad-(i+1)*bw+bw*.2, w = bw*.6, hgt = (H-30)*b.n/max, y = H-hgt;

  });
  return svg;
}

async function saveFile(filename, data, mime){
  if (window.claude && window.claude.use){
    const dl = await window.claude.use("downloads");
    if (dl){ try { await dl.save({filename, data: data instanceof ArrayBuffer ? data : new Blob([data],{type:mime})}); return true; } catch(e){ if (e && e.code === "declined") return false; } }

}

  for (const c of ["settings","meditations","readings","members",...notes,"accounts"]) await add(c);
  for (const k of Object.keys(docs)) if (k.startsWith("members/preview-")) delete docs[k];
  // on the server a confessee's notebook and his father's messages stay between the two of them (2026-11-04)
  for (const k of Object.keys(docs)) if (/^members\/[^/]+$/.test(k) && (Store.mode !== "cloud" || (S.account && k === "members/"+S.account.id))){ await add(k+"/inbox"); await add(k+"/notebook"); }

async function restoreDocs(docs){
  if (Store.mode === "cloud" && Object.keys(docs || {}).some(k => k.startsWith("priest/main/"))){
    toast("دي نسخة من البرنامج القديم (الملف الواحد)، ومينفعش ترجع على السيرفر لأن الحسابات مختلفة."); return 0; }
  let n = 0;
  for (const [k, v] of Object.entries(docs || {})){
    if (!RESTORE_OK.test(k) || !v || typeof v !== "object") continue;
    if (Store.mode === "cloud" && /^priest\/[^/]+\/people\//.test(k) && !k.startsWith(PP()+"/")) continue;  // a father's private notes stay his
    if (Store.mode === "cloud" && /^meditations\//.test(k)) continue;  // so do his meditations (2026-11-07)

    await Store.set(k, v); n++;

/* ---------- gold frame (SVG overlay) ---------- */
function frameSVG(w, h){ const m = 8, r = 16, k = 26;
  const corner = (x, y, sx, sy) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})"><path d="M0 ${k} Q0 0 ${k} 0" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M6 ${k + 8} Q6 6 ${k + 8} 6" fill="none" stroke="currentColor" stroke-width="1"/>`
    + `<circle cx="12" cy="12" r="4.2" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="#fff8e0"/><path d="M${k + 4} 0 l5 -4 l5 4 l-5 4z M0 ${k + 4} l-4 5 l4 5 l4 -5z" fill="currentColor"/></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".5" stop-color="currentColor"/><stop offset="1" stop-color="#8a6414"/></linearGradient></defs>`
    + `<rect x="${m}" y="${m}" width="${w - 2 * m}" height="${h - 2 * m}" rx="${r}" fill="none" stroke="url(#fg)" stroke-width="1.6"/>`
    + `<rect x="${m + 5}" y="${m + 5}" width="${w - 2 * m - 10}" height="${h - 2 * m - 10}" rx="${r - 4}" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width=".8" stroke-dasharray="2 4"/>`
    + corner(m + 2, m + 2, 1, 1) + corner(w - m - 2, m + 2, -1, 1) + corner(m + 2, h - m - 2, 1, -1) + corner(w - m - 2, h - m - 2, -1, -1)
    + `<g transform="translate(${w / 2} ${m})"><path d="M-30 0 H-9 M9 0 H30" stroke="currentColor" stroke-width="2"/><path d="M0 -6 l6 6 l-6 6 l-6 -6z" fill="currentColor"/><circle r="2" fill="#fff8e0"/></g></svg>`; }

async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function keyOk(k){ return await sha256(String(k||"").trim()) === ACTIVATION_HASH; }
/* Passwords: PBKDF2-SHA256 with a per-password salt. Records saved by older versions (single salted SHA-256)
   still verify and are upgraded on the next successful login. */
const KDF_ITER = 120000;
async function pbkdf2(pw, salt, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:new TextEncoder().encode(salt), iterations:iter, hash:"SHA-256"}, km, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function makeHash(pw){ const salt = newId()+newId(); return {salt, hash: await pbkdf2(pw, salt, KDF_ITER), kdf:"pbkdf2", iter:KDF_ITER}; }
async function checkPw(rec, pw){
  if (!rec || !rec.hash || !rec.salt) return false;
  if (rec.kdf === "pbkdf2") return await pbkdf2(pw, rec.salt, rec.iter || KDF_ITER) === rec.hash;
  return await sha256(rec.salt+"|"+pw) === rec.hash;
}
/* Login throttling: after 5 wrong tries the gate waits, doubling each further round of 5 (max 10 minutes). */
const LOCK_KEY = "ruhiya_lock";
function lockGet(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)||"null") || {n:0, until:0}; } catch(e){ return lockGet.mem || {n:0, until:0}; } }
function lockPut(o){ lockGet.mem = o; try { localStorage.setItem(LOCK_KEY, JSON.stringify(o)); } catch(e){} }
function lockWait(){ const l = lockGet(); return Math.max(0, Math.ceil((l.until - Date.now())/1000)); }
function lockFail(){ const l = lockGet(); l.n = (l.n||0)+1; if (l.n >= 5) l.until = Date.now() + Math.min(600, 30 * 2 ** Math.floor((l.n-5)/5)) * 1000; lockPut(l); }
function lockOk(){ lockPut({n:0, until:0}); }

}

const accTry = async (fn) => { try { await fn(); return true; } catch(e){ toast(cloudMsg(e)); return false; } };
createAccount = async (name, role, pw) => {
  if (!S.church || !S.church.live){ toast(cloudMsg("licence expired")); return false; }
  return accTry(async () => {
    const email = await mailFor(S.church.slug, name);
    // a sign-in left over from an earlier attempt that never became an account is cleared and the name reused
    let uid; try { uid = await Cloud.signUp(email, pw); } catch(e){
      if (!/already|exists/i.test(e.message) || !(await Cloud.rpc("release_orphan", {p_email:email, p_name:name}).catch(() => false))) throw e;
      uid = await Cloud.signUp(email, pw); }
    if (!uid) throw new Error("signup failed");
    await Cloud.rpc("add_account", {p_uid:uid, p_name:name, p_role:role});
    Cloud.refresh("accounts/x");
  });
};

// someone who signed themselves up: check now and then whether they were approved, then open the whole app
function watchApproval(){
  clearInterval(watchApproval.t);
  if (!S.account) return;
  // a signed-in account whose role the admin changes (e.g. a confessee made أبونا) is signed out and signs in again into its new screen
  if (S.account.role !== "pending"){ const role = S.account.role;
    // «متصل الآن» (2026-11-07): an open app tells the server once a minute
    const ping = () => { if (!document.hidden && Cloud.sess && S.account && !Store.preview) Cloud.rpc("ping").catch(() => {}); };
    ping(); watchApproval.n = 0;
    watchApproval.t = setInterval(async () => {
      if (++watchApproval.n % 3 === 0) ping();
      if (document.hidden || !Cloud.sess || !S.account || Store.preview) return;
      try { const me = await Cloud.rpc("me"); if (!me || !S.account) return;
        if (me.role !== role || !me.active){ clearInterval(watchApproval.t); S.gateNote = me.active ? "برجاء الدخول بالاسم وكلمة السر." : ""; logout(); return; }
        if (me.name !== S.account.name || (me.renamed_from || "") !== (S.account.renamedFrom || "")) renameApi.refresh();
      } catch(e){}
    }, 20000);
    return; }
  watchApproval.t = setInterval(async () => {
    if (document.hidden || !Cloud.sess) return;
    try { const me = await Cloud.rpc("me");
      if (!me || me.role === "pending") return;
      clearInterval(watchApproval.t); Cloud.me = me;
      if (!me.active){ logout(); return; }
      const keep = {meForm:S.draft.meForm, myKids:S.draft.myKids, myKidsFor:S.draft.myKidsFor, photo:S.draft.photo};
      applyAccount(cloudAccount(me)); Object.assign(S.draft, keep); S.tab = "me"; subscribe(); render(); toast("🎉 حسابك اتوافق عليه، والبرنامج كله فتحلك"); watchApproval();

  }, 20000);
}

    } else if (mode === "change"){
      const expired = Cloud.me && Cloud.me.pw_due && new Date(Cloud.me.pw_due) < new Date();
      sub = S.weakPw ? "أهلاً "+S.account.name+". كلمة السر الحالية سهلة التخمين، وحفاظًا على خصوصيتك برجاء اختيار كلمة سر أقوى (٨ حروف إنجليزية وأرقام على الأقل)."
        : expired ? "أهلاً "+S.account.name+". انتهت مدة كلمة السر (ثلاثة أشهر). حفاظًا على الخصوصية برجاء اختيار كلمة سر جديدة لم تُستخدم في آخر خمس مرات." : "أهلاً "+S.account.name+". كلمة السر دي اتعملتلك من حد تاني، فاختار كلمة سر خاصة بيك محدش يعرفها.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {
        const pw = v("gPw"), strong = ["admin","priest"].includes(S.account.role);
        { const pe = pwProblem(pw, Object.assign({}, S.account, Cloud.me || {})); if (pe) fail(pe+"."); } if (pw !== v("gPw2")) fail("كلمتين السر مش زي بعض.");
        if (await Cloud.rpc("pw_reused", {p_pw:pw})) fail("لا يمكن استخدام كلمة سر من آخر خمس كلمات سر. برجاء اختيار كلمة سر جديدة.");
        await Cloud.setOwnPassword(pw); await Cloud.rpc("password_changed"); if (Cloud.me) Cloud.me.pw_due = new Date(Date.now() + 91*864e5).toISOString(); if (S.account) S.account.pwDue = Cloud.me && Cloud.me.pw_due;
        await logAct("اختار كلمة سر جديدة"); S.account.mustChange = false; Cloud.me.must_change = false; S.weakPw = false;
        toast("كلمة السر اتغيّرت"); await finish(); }); }},
        h("label",null,"كلمة السر الجديدة", pwInput("gPw","كلمة السر الجديدة","new-password")),
        h("label",null,"اكتبها تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("احفظ وادخل"));
      extra = [h("button",{class:"linkish", type:"button", onclick:async()=>{ await Cloud.signOut(); S.account = null; mode = "login"; draw(); }},"رجوع")];
    } else if (mode === "activate" && !lic){
      sub = "اكتب كود الرخصة اللي أخدته من المطوّر.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {

        lockOk(); draw(); }); }},

      sub = "الرخصة سليمة لـ «"+lic.name+"». اعمل حساب الأدمن، وبعد كده الأدمن يعمل حسابات أبونا والمشرفين والمستخدمين.";
      form = h("form",{class:"form", onsubmit:e => { e.preventDefault(); busy(e.target, async () => {

        const email = await mailFor(lic.slug, name);
        try { await Cloud.signUp(email, pw); } catch(e){ if (!/already|exists/i.test(e.message)) throw e; }
        await Cloud.signIn(email, pw);
        await Cloud.rpc("claim_church", {p_code:licCode, p_name:name});
        slug = lic.slug; const me = await Cloud.rpc("touch_login"); lic = null;
        await enter(me); toast("الكنيسة اتفعّلت. كود الكنيسة: "+me.slug); }); }},
        h("div",{class:"notice"}, h("span",null, "كود الكنيسة: ", h("b",{dir:"ltr"}, lic.slug), " · الرخصة لحد "+fmtShort(lic.expires_at))),
        h("label",null,"اسم الأدمن", h("input",{id:"gName", autocomplete:"username", placeholder:"اكتب اسمك"})),
        h("label",null,"كلمة السر", pwInput("gPw","كلمة السر","new-password")),
        h("label",null,"اكتب كلمة السر تاني", pwInput("gPw2","تأكيد كلمة السر","new-password")),
        err, btn("تفعيل الكنيسة وإنشاء حساب الأدمن"));
      extra = [h("button",{class:"linkish", type:"button", onclick:()=>{ lic = null; draw(); }},"رجوع")];
    }
    const occId = info && info.occasion && OCCASION.find(info.occasion) ? info.occasion : "";
    gate.replaceChildren(gateCard([churchMark(), h("div",null, h("h1",null,title), h("p",{class:"muted small"}, sub))],
      [form, ...extra, h("p",{class:"small muted gate-note", style:"margin:0"},"🔒 بياناتك محفوظة على سيرفر الكنيسة، ومحدش بيشوفها غير اللي ليه صلاحية."), devBlock()]));
    OCCASION.dress(gate, occId); OCCASION.snow(OCCASION.SNOW.has(occId));
    const f = gate.querySelector("input"); if (f) f.focus();
  };
  draw();
}
// phone notifications (أبونا only): the public key comes from the «menrit-push» Edge Function; the subscription is kept by save_push
// أبونا's private calendar link (2026-11-05): the same function serves it as an .ics his phone's calendar subscribes to

newsApi = {

  async mark(id){ await Cloud.rpc("set_news_seen", {p_id:id}); if (Cloud.me) Cloud.me.news_seen = id; }
};

// fixing someone's national ID (his own father or the admin)
childApi = { async set(uid, data){ const r = await Cloud.rpc("child_profile_set", {p_uid:uid, p_data:data}); Cloud.refresh("members/x"); Cloud.refresh("pending/x"); Cloud.refresh("nid_dupes/x"); Cloud.refresh("accounts/x"); return r; } };
// the sign-in name follows the name (2026-11-10): the person's own new name is read back, and «قرأت» hides the big notice
renameApi = {
  async refresh(){ try { const me = await Cloud.rpc("me"); if (!me || !S.account) return; Cloud.me = me;
    if (me.name !== S.account.name || (me.renamed_from || "") !== (S.account.renamedFrom || "")){ S.account.name = me.name; S.account.renamedFrom = me.renamed_from || "";
      const b = Bio.get(); if (b && b.uid === me.uid && b.name !== me.name){ b.name = me.name; Bio.put(b); } render(); } } catch(e){} },
  async sync(uid){ const r = await Cloud.rpc("sync_login_name", {p_uid:uid}); Cloud.refresh("accounts/x"); return r; },
  async seen(){ await Cloud.rpc("rename_seen"); if (S.account) S.account.renamedFrom = ""; if (Cloud.me) Cloud.me.renamed_from = ""; }
};

visitApi = { async notify(items){ const n = await Cloud.rpc("visit_notify", {p_items:items}); return n; } };
// «إزالة من أولادي» (2026-11-07): the father lets go of a confessee; his notes about him are deleted
dbApi = { usage: () => Cloud.rpc("db_usage") };
onlineApi = { list: () => Cloud.rpc("online_list") };
reqSumApi = { get: (from, to) => Cloud.rpc("req_summary", {p_from:from, p_to:to}) };
// «🛟 الدعم الفني» (2026-11-10)
supApi = { feed: uid => Cloud.rpc("support_feed", {p_uid:uid || null}),
  send: (text, topic, info) => Cloud.rpc("support_send", {p_text:text, p_topic:topic || null, p_info:info || null}),
  reply: (uid, text) => Cloud.rpc("support_reply", {p_uid:uid, p_text:text}),

  seen: uid => Cloud.rpc("support_seen", {p_uid:uid || null}),

  mark: (room, typing) => Cloud.rpc("chat_mark", {p_room:room, p_typing:typing}) };

// passport instead of the national ID (2026-11-05): the admin makes a one-time code, the person uses it with the passport number
passportApi = {
  make(note){ return Cloud.rpc("passport_new", {p_note:note||""}); },

};

calApi = {
  async link(){ const t = await Cloud.rpc("cal_link"); return SB + "/functions/v1/menrit-push?cal=" + t; },
  async reset(){ const t = await Cloud.rpc("cal_reset"); return SB + "/functions/v1/menrit-push?cal=" + t; }
};
pushApi = {
  fn: SB + "/functions/v1/menrit-push",
  supported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; },
  ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  standalone(){ try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch(e){ return false; } },
  async current(){ if (!this.supported()) return null; const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; },
  keyOf(k){ return Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4)), c => c.charCodeAt(0)); },
  async status(){ const s = await this.current(); if (!s) return {on:false};
    let st = await Cloud.rpc("push_status", {p_endpoint:s.endpoint}).catch(() => ({on:false})) || {on:false};
    // (2026-11-06) the server forgot this phone (an expired or renewed registration) while it still has permission: register it again quietly
    try { if (!st.on && Notification.permission === "granted" && localStorage.getItem("menrit_push_on") === "1"){ await this.enable(); return {on:true, renewed:true}; } if (st.on) localStorage.setItem("menrit_push_on", "1"); } catch(e){}
    // the notification key changed on the server: subscribe again quietly, or the phone would stop getting them
    try { if (st.on && Notification.permission === "granted" && s.options && s.options.applicationServerKey){
      const r = await fetch(this.fn).then(x => x.ok ? x.json() : null).catch(() => null);
      if (r && r.key && new Uint8Array(s.options.applicationServerKey).join() !== this.keyOf(r.key).join()){ await this.enable(); return {on:true, renewed:true}; } } } catch(e){}
    return st; },
  async enable(){
    const ui = m => { const e = new Error(m); e.ui = true; return e; };
    const r = await fetch(this.fn).then(x => x.ok ? x.json() : null).catch(() => null);
    if (!r || !r.key) throw ui("التنبيهات لسه متجهزتش على السيرفر. كلّم الأدمن.");
    if (await Notification.requestPermission() !== "granted") throw ui("لازم توافق على الإشعارات عشان التنبيهات توصلك.");
    const reg = await navigator.serviceWorker.ready;
    const key = this.keyOf(r.key);
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey && new Uint8Array(sub.options.applicationServerKey).join() !== key.join()){ await sub.unsubscribe().catch(()=>{}); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
    const j = sub.toJSON();
    await Cloud.rpc("save_push", {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth});
    try { localStorage.setItem("menrit_push_on", "1"); } catch(e){}
  },
  // «📨 تجربة التنبيه»: registers this phone again when needed, then asks the server to send a test notification
  async test(){
    let s = await this.current(), r = await Cloud.rpc("push_test", {p_endpoint:s ? s.endpoint : ""});
    if (r && r.server && !r.here && Notification.permission === "granted"){ await this.enable(); s = await this.current(); r = await Cloud.rpc("push_test", {p_endpoint:s ? s.endpoint : ""}); }
    return r || {}; },
  async disable(){ try { localStorage.removeItem("menrit_push_on"); } catch(e){} const s = await this.current(); if (s){ await Cloud.rpc("drop_push", {p_endpoint:s.endpoint}).catch(()=>{}); await s.unsubscribe().catch(()=>{}); } }
};

// how long the app took to show its data on this phone (2026-11-07): the last 10 times, kept for the admin's «سرعة التحميل» card
speedApi = {
  async save(ms, cached, det){
    if (!Cloud.me || Store.preview || !Cloud.church()) return;
    const k = "menrit_speed_"+Cloud.me.uid; let list = [];
    try { list = JSON.parse(localStorage.getItem(k) || "[]"); } catch(e){}
    list = (Array.isArray(list) ? list : []).filter(x => x && x.at > Date.now() - 14*864e5).slice(-9);
    list.push(Object.assign({ms:Math.round(ms), at:Date.now(), net:(navigator.connection && navigator.connection.effectiveType) || "", cached:cached ? 1 : 0}, det || {}));
    try { localStorage.setItem(k, JSON.stringify(list)); } catch(e){}
    const body = JSON.stringify({church_id:Cloud.church(), path:"speed/"+Cloud.me.uid, data:{name:Cloud.me.name, role:Cloud.me.role, samples:list}});
    await Cloud.req("/rest/v1/docs?on_conflict=church_id,path", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body}).catch(() => {});
  }
};
